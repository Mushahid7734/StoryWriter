    toast('Cleared');
  };
  $('#sw-view-write').onclick = () => { state.viewMode = 'write'; setViewMode(); };
  $('#sw-view-cork').onclick = () => { saveCurrent(); state.viewMode = 'cork'; setViewMode(); };
  $('#sw-toggle-comments').onclick = () => ROOT.classList.toggle('sw-comments-open');
  $('#sw-add-comment').onclick = addComment;
  $('#sw-snapshot-btn').onclick = takeSnapshot;
  $('#sw-snapshots-list-btn').onclick = listSnapshots;
  $('#sw-goals-btn').onclick = openGoals;

  $('#sw-typewriter-btn').onclick = toggleTypewriter;
  $('#sw-read-btn').onclick = readAloud;
  $('#sw-threads-btn').onclick = () => {
    ROOT.classList.toggle('sw-threads-open');
    renderThreads();
  };
  $('#sw-thread-add').onclick = addThread;
  $('#sw-ref-btn').onclick = () => pinReference(null, null);


  $$('.sw-side-tabs button').forEach(btn => {
    btn.onclick = () => {
      $$('.sw-side-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const side = btn.dataset.side;
      $('#sw-side-chapters').style.display = side === 'chapters' ? '' : 'none';
      $('#sw-side-outline').style.display = side === 'outline' ? '' : 'none';
      if (side === 'outline') renderOutline();
    };
  });
  $$('.sw-tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('#sw-loc-add').onclick = () => editLocation(null);
  $('#sw-loc-docx').onclick = () => saveListDocx('Locations', state.locations, [['Type','kind'],['Description','description'],['Notes','notes']], 'locations.docx');
  $('#sw-char-add').onclick = () => editCharacter(null);
  $('#sw-char-docx').onclick = () => saveListDocx('Characters', state.characters, [['Role','role'],['Age','age'],['Traits','traits'],['Wants','wants'],['Fears','fears'],['Arc','arc']], 'characters.docx');
  $('#sw-rel-add').onclick = () => editReligion(null);
  $('#sw-rel-docx').onclick = () => saveListDocx('Religions', state.religions, [['Summary','summary'],['Deities','deities'],['Beliefs','beliefs']], 'religions.docx');
  $('#sw-pl-add').onclick = () => editPlanet(null);
  $('#sw-pl-docx').onclick = () => saveListDocx('Planets', state.planets, [['Summary','summary'],['Star','star'],['Climate','climate']], 'planets.docx');
  $('#sw-brain-docx').onclick = async () => {
    state.brainstorm = $('#sw-brainstorm').value; save();
    if (!window.docx) { toast('DOCX not loaded'); return; }
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const children = [new Paragraph({ children: [new TextRun({ text: 'Brainstorm', bold: true, size: 32 })] })];
    (state.brainstorm || '').split(/\n/).forEach(line => {
      children.push(new Paragraph({ children: [new TextRun({ text: line || ' ', size: 22 })] }));
    });
    saveAs(await Packer.toBlob(new Document({ sections: [{ children }] })), 'brainstorm.docx');
    toast('Downloaded');
  };
  $('#sw-brainstorm').oninput = () => { state.brainstorm = $('#sw-brainstorm').value; save(); };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (!ROOT.contains(document.activeElement) && document.activeElement !== editor) {
      // still allow global when focus in root
    }
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === 'k') { e.preventDefault(); openSearch(); }
    if (mod && e.key === '\\') { e.preventDefault(); ROOT.classList.toggle('sw-sidebar-collapsed'); }
    if (mod && e.key === 'b' && document.activeElement === editor) { /* let browser bold work via exec in some browsers */ }
  });

  // Wire project / disk buttons
  var projBtn = document.getElementById('sw-projects-btn');
  if (projBtn) projBtn.onclick = function () { openProjectsModal(); };
  var diskSave = document.getElementById('sw-disk-save');
  if (diskSave) diskSave.onclick = function () { saveToDisk(); };
  var diskOpen = document.getElementById('sw-disk-open');
  if (diskOpen) diskOpen.onclick = function () { openFromDisk(); };

  // Drag-and-drop JSON restore
  ;['dragenter', 'dragover'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if ([].indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
      e.preventDefault();
    });
  });
  window.addEventListener('drop', async function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    var f = e.dataTransfer.files[0];
    if (!f || !/\.json$/i.test(f.name) && f.type !== 'application/json') return;
    e.preventDefault();
    var text = await f.text();
    await importProjectJson(text, f.name);
  });

  // Init (async)
  (async function boot() {
    try {
      await migrateLocalToIdb();
      var meta = readMeta();
      if (meta.currentId) {
        var ok = await loadProjectById(meta.currentId);
        if (!ok) load();
      } else {
        load();
        if (!currentProjectId) {
          currentProjectId = uid();
          currentProjectName = 'My project';
          await persistToIdbPromise();
        }
      }
    } catch (e) {
      load();
    }
    if (!state.goals.sessionBase && state.goals.sessionBase !== 0) state.goals.sessionBase = totalWords();
    if (!state.openThreads) state.openThreads = [];
    refreshUI();

    // PWA shortcuts: ?action=new-scene | new-project
    try {
      var params = new URLSearchParams(window.location.search);
      var action = params.get('action');
      if (action === 'new-scene') {
        addScene();
      } else if (action === 'new-project') {
        await createNewProject('Untitled');
      }
      if (action && window.history && window.history.replaceState) {
        window.history.replaceState({}, '', window.location.pathname);
      }
    } catch (e) {}

    window.addEventListener('beforeunload', function () { saveCurrent(); save(); });
  })();

  // PWA: service worker + update toast + install
  if ('serviceWorker' in navigator) {
    var swUrl = new URL('story-writer-sw.js', window.location.href);
    navigator.serviceWorker.register(swUrl.href, { scope: new URL('./', window.location.href).href }).then(function (reg) {
      function promptUpdate() {
        if (!reg.waiting) return;
        openModal(
          '<h3>Update available</h3>' +
          '<p style="margin:0 0 12px;line-height:1.5">A new version of StoryWriter is ready. Reload to use it. Your projects stay in this browser.</p>' +
          '<div class="sw-modal-actions">' +
          '<button type="button" class="sw-btn" id="m-no">Later</button>' +
          '<button type="button" class="sw-btn sw-btn-primary" id="m-yes">Reload</button></div>'
        );
        $('#m-no').onclick = closeModal;
        $('#m-yes').onclick = function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          closeModal();
        };
      }
      if (reg.waiting) promptUpdate();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) promptUpdate();
        });
      });
      setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
    }).catch(function () {});
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    var btn = document.getElementById('sw-install-btn');
    if (btn) btn.style.display = '';
  });
  var installBtn = document.getElementById('sw-install-btn');
  if (installBtn) {
    installBtn.addEventListener('click', function () {
      if (!deferredInstall) {
        toast('Use your browser Install app menu if available');
        return;
      }
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; installBtn.style.display = 'none'; });
    });
  }
  })();
</script>
</body>
</html>

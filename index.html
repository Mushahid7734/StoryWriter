  // ----- Highlight passes -----
  var ADVERBS = /\\b\\w+ly\\b/gi;
  var FILTERS = /\\b(just|really|very|quite|rather|suddenly|somehow|began to|started to|felt|saw|heard|knew|realized|noticed)\\b/gi;
  function clearHighlights() {
    var marks = editor.querySelectorAll('.sw-hl-dialogue, .sw-hl-adverb, .sw-hl-filter');
    // simpler: reload content without highlight wrappers
    var sc = getActiveScene();
    if (sc) editor.innerHTML = sc.content || '';
    state.highlightMode = '';
  }
  function applyHighlight(mode) {
    saveCurrent();
    var sc = getActiveScene();
    if (!sc) return;
    if (state.highlightMode === mode) { clearHighlights(); save(); return; }
    clearHighlights();
    state.highlightMode = mode;
    var html = sc.content || '';
    // work on plain-ish: wrap in temp
    var d = document.createElement('div');
    d.innerHTML = html;
    if (mode === 'dialogue') {
      // highlight text in quotes
      var walk = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      var nodes = [];
      while (walk.nextNode()) nodes.push(walk.currentNode);
      nodes.forEach(function (n) {
        if (!n.nodeValue || n.nodeValue.indexOf('"') < 0) return;
        var parts = n.nodeValue.split(/(\"[^\"]*\")/g);
        if (parts.length < 2) return;
        var frag = document.createDocumentFragment();
        parts.forEach(function (p) {
          if (/^\"[^\"]*\"$/.test(p)) {
            var sp = document.createElement('span');
            sp.className = 'sw-hl-dialogue';
            sp.textContent = p;
            frag.appendChild(sp);
          } else frag.appendChild(document.createTextNode(p));
        });
        n.parentNode.replaceChild(frag, n);
      });
    } else if (mode === 'adverb') {
      var walk2 = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      var nodes2 = [];
      while (walk2.nextNode()) nodes2.push(walk2.currentNode);
      nodes2.forEach(function (n) {
        if (!n.nodeValue || !/ly\\b/i.test(n.nodeValue)) return;
        var html2 = n.nodeValue.replace(ADVERBS, function (m) { return '[[HLADV]]' + m + '[[/HLADV]]'; });
        if (html2 === n.nodeValue) return;
        var wrap = document.createElement('span');
        wrap.innerHTML = html2.replace(/\\[\\[HLADV\\]\\]/g, '<span class="sw-hl-adverb">').replace(/\\[\\[\\/HLADV\\]\\]/g, '</span>');
        n.parentNode.replaceChild(wrap, n);
      });
    } else if (mode === 'filter') {
      var walk3 = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      var nodes3 = [];
      while (walk3.nextNode()) nodes3.push(walk3.currentNode);
      nodes3.forEach(function (n) {
        if (!n.nodeValue) return;
        var html3 = n.nodeValue.replace(FILTERS, function (m) { return '[[HLFIL]]' + m + '[[/HLFIL]]'; });
        if (html3 === n.nodeValue) return;
        var wrap = document.createElement('span');
        wrap.innerHTML = html3.replace(/\\[\\[HLFIL\\]\\]/g, '<span class="sw-hl-filter">').replace(/\\[\\[\\/HLFIL\\]\\]/g, '</span>');
        n.parentNode.replaceChild(wrap, n);
      });
    }
    editor.innerHTML = d.innerHTML;
    // do not save highlighted markup into scene permanently
  }
  function openHighlightMenu() {
    openModal('<h3>Highlight pass</h3>' +
      '<p style="font-size:0.88rem;color:var(--sw-muted);margin:0 0 12px">Highlights are temporary and not saved into the manuscript.</p>' +

  function updateStreakDisplay() {
    if (!state.streak) state.streak = { days: {}, lastDate: '' };
    if (Array.isArray(state.streak.days)) {
      var m = {}; state.streak.days.forEach(function (d) { m[d] = 1; }); state.streak.days = m;
    }
    if (!state.streak.days) state.streak.days = {};
    var el = document.getElementById('sw-streak');

    var d = new Date();
    for (var i = 0; i < 400; i++) {
      var key = d.toISOString().slice(0, 10);
      if (state.streak.days[key]) count++;
      else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    el.innerHTML = 'Streak: <strong>' + count + '</strong>';
  }

  function recordStreakIfNeeded() {
    if (!state.streak) state.streak = { days: [], lastDate: '' };
    var t = todayStr();
    if (state.streak.lastDate === t) return;
    // only record if wrote something today (called from save when words increase)
    var words = totalWords();
    if (words <= 0) return;
    if (state.streak.days.indexOf(t) === -1) state.streak.days.push(t);
    // keep last 365
    state.streak.days = state.streak.days.slice(-365);
    state.streak.lastDate = t;
    // trim broken streaks for display count: count consecutive days ending today
    var count = 0;
    var cur = new Date();
    for (var i = 0; i < 400; i++) {
      var key = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' + String(cur.getDate()).padStart(2, '0');
      if (state.streak.days.indexOf(key) >= 0) count++;
      else break;
      cur.setDate(cur.getDate() - 1);
    }
    updateStreakDisplay();
  }

  function formatPomo(sec) {

  function togglePomodoro() {

    if (pomoLeft <= 0) pomoLeft = 25 * 60;

  function openFindReplace() {

      '<label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:0.88rem">' +

      '<button type="button" class="sw-btn sw-btn-primary" id="m-repl-all">Replace all</button></div>'
    );
    $('#m-cancel').onclick = closeModal;
    var lastIdx = 0;
    function getTargets() {
      if ($('#m-find-all').checked) {
        var list = [];
        state.chapters.forEach(function (ch) {
          ch.scenes.forEach(function (sc) { list.push(sc); });
        });
        return list;
      }
      return [getActiveScene()].filter(Boolean);
    }
    $('#m-find-next').onclick = function () {
      var q = ($('#m-find').value || '');
      if (!q) return;
      var sc = getActiveScene();
      if (!sc) return;
      var plain = stripHtml(sc.content);
      var idx = plain.toLowerCase().indexOf(q.toLowerCase(), lastIdx);
      if (idx < 0) { lastIdx = 0; idx = plain.toLowerCase().indexOf(q.toLowerCase(), 0); }
      if (idx < 0) { toast('Not found'); return; }
      lastIdx = idx + q.length;
      toast('Found at position ' + (idx + 1) + ' in scene text');
    };
    function replaceInScene(sc, find, repl, all) {
      var plain = stripHtml(sc.content);
      var re = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), all ? 'gi' : 'i');
      if (!re.test(plain)) return 0;
      if (all) {
        var count = (plain.match(new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi')) || []).length;
        // operate on HTML carefully: replace in text nodes via plain rebuild
        sc.content = plain.replace(new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), repl).split('\n').map(function (l) {
          return '<p>' + escapeHtml(l) + '</p>';
        }).join('');
        return count;
      }
      sc.content = plain.replace(new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), repl).split('\n').map(function (l) {
        return '<p>' + escapeHtml(l) + '</p>';
      }).join('');
      return 1;
    }
    $('#m-repl-one').onclick = function () {
      var find = $('#m-find').value;
      var repl = $('#m-repl').value;
      if (!find) return;
      saveCurrent();
      var n = replaceInScene(getActiveScene(), find, repl, false);
      loadIntoEditor(); save();
      toast(n ? 'Replaced' : 'Not found');
    };
    $('#m-repl-all').onclick = function () {
      var find = $('#m-find').value;
      var repl = $('#m-repl').value;
      if (!find) return;
      saveCurrent();
      var total = 0;
      getTargets().forEach(function (sc) { total += replaceInScene(sc, find, repl, true); });
      loadIntoEditor(); save();
      toast('Replaced ' + total + ' occurrence(s)');
    };
  }

  // Soft continuity warnings
  function runContinuityCheck() {
    var bar = document.getElementById('sw-warn-bar');
    if (!bar) return;
    var warnings = [];
    state.characters.forEach(function (c) {
      if (!c.name) return;
      // age mentioned differently in notes vs appearance
      var ageNums = [];
      [c.age, c.appearance, c.notes, c.background].forEach(function (t) {
        if (!t) return;
        var m = String(t).match(/\b(\d{1,3})\s*(years?\s*old|yo)\b/i) || String(t).match(/\bage\s*[:\s]*(\d{1,3})\b/i);
        if (m) ageNums.push(m[1]);
      });
      ageNums = ageNums.filter(function (v, i, a) { return a.indexOf(v) === i; });
      if (ageNums.length > 1) warnings.push(c.name + ': possible age mismatch (' + ageNums.join(' vs ') + ')');
      var eyes = [];
      [c.appearance, c.notes].forEach(function (t) {
        if (!t) return;
        var m = String(t).match(/\b(blue|green|brown|hazel|gray|grey|black|amber|violet)\s+eyes?\b/i);
        if (m) eyes.push(m[1].toLowerCase());
      });
      eyes = eyes.filter(function (v, i, a) { return a.indexOf(v) === i; });
      if (eyes.length > 1) warnings.push(c.name + ': eye color conflict (' + eyes.join(' vs ') + ')');
      if (/dead|deceased|killed|died/i.test(c.notes || '') || /dead|deceased/i.test(c.role || '')) {
        // speaking in later scenes?
        var name = c.name.toLowerCase();
        state.chapters.forEach(function (ch) {
          ch.scenes.forEach(function (sc) {
            var plain = stripHtml(sc.content);
            if (new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s+said', 'i').test(plain)) {
              warnings.push(c.name + ' may be dead but still speaks in ' + ch.title + '/' + sc.title);
            }
          });
        });
      }
    });
    if (warnings.length) {
      bar.textContent = 'Continuity: ' + warnings.slice(0, 3).join(' · ') + (warnings.length > 3 ? ' …' : '');
      bar.classList.add('show');
    } else {
      bar.textContent = '';
      bar.classList.remove('show');
    }
  }

  function applyHighlight(mode) {
    saveCurrent();
    clearHighlights();
    state.highlightMode = mode || '';
    if (!mode) { loadIntoEditor(); save(); return; }
    var htmlc = editor.innerHTML;
    if (mode === 'dialogue') {
      htmlc = htmlc.replace(/(&quot;|")([^"&]{2,})(&quot;|")/g, function (m, a, mid, b) {
        return a + '<span class="sw-hl-dialogue">' + mid + '</span>' + b;
      });
    } else if (mode === 'adverb') {
      htmlc = stripHtml(htmlc).split(/(\s+)/).map(function (w) {
        if (/ly$/i.test(w) && w.length > 3) return '<span class="sw-hl-adverb">' + escapeHtml(w) + '</span>';
        return escapeHtml(w);
      }).join('');
      htmlc = htmlc.split('\n').map(function (l) { return '<p>' + l + '</p>'; }).join('');
    } else if (mode === 'filter') {
      var filters = ['just','really','very','quite','suddenly','somehow','began to','started to','felt','saw','heard','knew','realized'];
      var plain = stripHtml(htmlc);
      filters.forEach(function (f) {
        var re = new RegExp('\\b(' + f.replace(/ /g, '\\s+') + ')\\b', 'gi');
        plain = plain.replace(re, '§§$1§§');
      });
      htmlc = escapeHtml(plain).replace(/§§([^§]+)§§/g, '<span class="sw-hl-filter">$1</span>');
      htmlc = htmlc.split('\n').map(function (l) { return '<p>' + l + '</p>'; }).join('');
    }
    editor.innerHTML = htmlc;
    toast('Highlight: ' + (mode || 'off') + ' (save scene to keep text; toggle off before final export)');

        ch.synopsis = 'Romance beat: ' + t;
        state.chapters.push(ch);
      });
      state.activeChapterId = state.chapters[0].id;
      state.activeSceneId = state.chapters[0].scenes[0].id;
      state.goals.sessionBase = 0;
      renderChapters(); loadIntoEditor(); save(); toast('Romance template');
      return;
    }
    _applyTemplate(tpl);
  };

  // Wire new UI (called after DOM ready - buttons exist)
  function wireExtendedFeatures() {
    var byId = function (id) { return document.getElementById(id); };
    if (byId('sw-pomo-btn')) byId('sw-pomo-btn').onclick = togglePomodoro;
    if (byId('sw-find-btn')) byId('sw-find-btn').onclick = openFindReplace;
    if (byId('sw-hl-btn')) byId('sw-hl-btn').onclick = openHighlightMenu;
    if (byId('sw-stats-btn')) byId('sw-stats-btn').onclick = showStats;
    if (byId('sw-paste-plain-btn')) {
      byId('sw-paste-plain-btn').onclick = togglePastePlain;
      if (state.pastePlain) byId('sw-paste-plain-btn').style.outline = '2px solid var(--sw-ok)';
    }
    if (byId('sw-rev-btn')) byId('sw-rev-btn').onclick = toggleRevision;
    if (byId('sw-compare-btn')) byId('sw-compare-btn').onclick = openCompare;
    if (byId('sw-tl-add')) byId('sw-tl-add').onclick = function () { editTimelineEvent(null); };
    if (byId('sw-rel-add')) byId('sw-rel-add').onclick = editRelation;
    if (byId('sw-series-set')) byId('sw-series-set').onclick = async function () {
      var n = await swPrompt('Series name', state.seriesName || '');
      if (n === null) return;
      state.seriesName = n.trim();
      save(); renderSeries();
    };
    if (byId('sw-series-link')) byId('sw-series-link').onclick = async function () {
      if (!state.seriesProjectIds) state.seriesProjectIds = [];
      if (state.seriesProjectIds.indexOf(currentProjectId) === -1) {
        state.seriesProjectIds.push(currentProjectId);
        save(); renderSeries(); toast('This project linked to series');
      } else toast('Already linked');
    };
    updateStreakDisplay();
    updatePomoDisplay();
  }

  // Hook streak into onEditorInput
  var _onEditorInput = onEditorInput;
  onEditorInput = function () {
    _onEditorInput();
    recordStreakIfNeeded();
    if (totalWords() % 50 === 0) runContinuityCheck();
  };

  // Location hierarchy: patch editLocation to add parent field - via string already done hard
  // Onboarding tip for disk once
  function maybeDiskTip() {
    try {
      if (localStorage.getItem('storywriter-disk-tip')) return;
      localStorage.setItem('storywriter-disk-tip', '1');
    } catch (e) { return; }
    setTimeout(function () {
      toast('Tip: Save disk / Open disk moves projects between devices');
    }, 2500);
  }



  // ---- Feature safety net (ensure all tools are wired once) ----
  (function wireExtraFeatures() {
    function byId(id) { return document.getElementById(id); }
    function on(id, fn) {
      var el = byId(id);
      if (el && !el.dataset.swWired) { el.dataset.swWired = '1'; el.addEventListener('click', fn); }
    }
    on('sw-find-btn', function () { if (typeof openFindReplace === 'function') openFindReplace(); });
    on('sw-hl-btn', function () { if (typeof openHighlightMenu === 'function') openHighlightMenu(); });
    on('sw-stats-btn', function () { if (typeof showStats === 'function') showStats(); });
    on('sw-continuity-btn', function () { if (typeof runContinuityCheck === 'function') runContinuityCheck(); });
    on('sw-rev-btn', function () { if (typeof toggleRevision === 'function') toggleRevision(); else if (typeof toggleRevisionMode === 'function') toggleRevisionMode(); });
    on('sw-compare-btn', function () { if (typeof openCompare === 'function') openCompare(); });
    on('sw-paste-plain', function () {
      state.pastePlain = state.pastePlain === false;
      save();
      var b = byId('sw-paste-plain');
      if (b) b.style.outline = state.pastePlain !== false ? '2px solid var(--sw-ok)' : '';
      toast(state.pastePlain !== false ? 'Plain paste on' : 'Plain paste off');
    });
    on('sw-tl-add', function () { if (typeof editTimelineEvent === 'function') editTimelineEvent(null); else if (typeof addTimelineEvent === 'function') addTimelineEvent(); });
    on('sw-relmap-add', function () { if (typeof editRelationship === 'function') editRelationship(null); });
    on('sw-series-set', async function () {
      var n = await swPrompt('Series name', state.seriesName || '');
      if (n === null) return;
      state.seriesName = n.trim();
      save();
      if (typeof renderSeries === 'function') renderSeries();
      toast('Series name saved');
    });
    on('sw-series-link', async function () {
      var n = await swPrompt('This book label (e.g. Book 1)', state.seriesBookLabel || 'Book 1');
      if (n === null) return;
      state.seriesBookLabel = n.trim();
      save();
      if (typeof renderSeries === 'function') renderSeries();
      toast('Book linked in series');
    });
    on('sw-pomodoro', function () {
      if (typeof togglePomodoro === 'function') togglePomodoro();
    });
    // Close compare
    on('sw-view-write', function () {
      ROOT.classList.remove('sw-compare-on');
    });
  })();


  function openPrintSetup() {
    saveCurrent();
    openModal(
      '<h3>Print manuscript</h3>' +
      '<p style="font-size:0.85rem;color:var(--sw-muted);margin:0 0 12px">Opens a clean print view (no StoryWriter chrome). In the browser print dialog, turn off headers and footers to hide date and URL.</p>' +
      '<div style="margin-bottom:10px"><label class="sw-lbl">Book size</label>' +
      '<select class="sw-sel" id="m-print-size">' +
      '<option value="6x9">6 × 9 in (standard trade)</option>' +
      '<option value="5.5x8.5">5.5 × 8.5 in</option>' +
      '<option value="5x8">5 × 8 in</option>' +
      '<option value="5.25x8">5.25 × 8 in</option>' +
      '<option value="8.5x11">8.5 × 11 in (letter)</option>' +
      '<option value="a5">A5</option>' +
      '</select></div>' +
      '<div style="margin-bottom:10px"><label class="sw-lbl">Layout template</label>' +
      '<select class="sw-sel" id="m-print-tpl">' +
      '<option value="classic">Classic (drop cap, indented body)</option>' +
      '<option value="modern">Modern (no indent, spaced paragraphs)</option>' +
      '<option value="elegant">Elegant (ornament under title)</option>' +
      '<option value="compact">Compact (tighter leading)</option>' +
      '</select></div>' +
      '<div class="sw-modal-actions">' +
      '<button type="button" class="sw-btn" id="m-cancel">Cancel</button>' +
      '<button type="button" class="sw-btn sw-btn-primary" id="m-print-go">Open print view</button></div>'
    );
    $('#m-cancel').onclick = closeModal;
    $('#m-print-go').onclick = function () {
      var size = $('#m-print-size').value;
      var tpl = $('#m-print-tpl').value;
      closeModal();
      runPrintView(size, tpl);
    };
  }

  function runPrintView(size, tpl) {
    var sizes = {
      '6x9': { w: '6in', h: '9in', pad: '0.75in 0.85in' },
      '5.5x8.5': { w: '5.5in', h: '8.5in', pad: '0.7in 0.75in' },
      '5x8': { w: '5in', h: '8in', pad: '0.65in 0.7in' },
      '5.25x8': { w: '5.25in', h: '8in', pad: '0.65in 0.7in' },
      '8.5x11': { w: '8.5in', h: '11in', pad: '1in' },
      'a5': { w: '148mm', h: '210mm', pad: '18mm 16mm' }
    };
    var s = sizes[size] || sizes['6x9'];
    var bodyCss = '';
    if (tpl === 'modern') {
      bodyCss = '.chapter p{text-indent:0;margin:0 0 0.85em} .chapter p.drop::first-letter{font-size:inherit;float:none;line-height:inherit;padding:0;font-weight:inherit}';
    } else if (tpl === 'compact') {
      bodyCss = 'body{font-size:11pt;line-height:1.35} .chapter p{text-indent:1.2em;margin:0}';
    } else if (tpl === 'elegant') {
      bodyCss = '.chapter h1::after{content:"❖";display:block;font-size:12pt;margin-top:0.4em;color:#666;font-weight:normal}';
    }
    var parts = [];
    state.chapters.forEach(function (ch, ci) {
      var paras = [];
      ch.scenes.forEach(function (sc) {
        var plain = stripHtml(sc.content || '');
        plain.split(/\n+/).forEach(function (line) {
          line = line.trim();
          if (line) paras.push(line);
        });
      });
      if (!paras.length) paras = [''];
      var htmlc = '<section class="chapter' + (ci ? ' break' : '') + '">';
      htmlc += '<h1>' + escapeHtml(ch.title || ('Chapter ' + (ci + 1))) + '</h1>';
      paras.forEach(function (p, pi) {
        var cls = (pi === 0 && tpl !== 'modern') ? ' class="drop"' : '';
        htmlc += '<p' + cls + '>' + escapeHtml(p) + '</p>';
      });
      htmlc += '</section>';
      parts.push(htmlc);
    });
    var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title></title><style>' +
      '@page{size:' + s.w + ' ' + s.h + ';margin:0}' +
      'html,body{margin:0;padding:0;background:#fff}' +
      'body{width:' + s.w + ';min-height:' + s.h + ';margin:0 auto;padding:' + s.pad + ';' +
      'font-family:Georgia,"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#111}' +
      '.chapter{page-break-after:always}.chapter:last-child{page-break-after:auto}' +
      '.chapter.break{page-break-before:always}' +
      'h1{text-align:center;font-size:1.35em;font-weight:600;margin:2.5em 0 1.75em;' +
      'page-break-after:avoid;letter-spacing:0.02em}' +
      '.chapter p{margin:0;text-indent:1.5em;orphans:3;widows:3;text-align:justify}' +
      '.chapter p.drop{text-indent:0}' +
      '.chapter p.drop::first-letter{float:left;font-size:3.2em;line-height:0.85;padding:0.05em 0.08em 0 0;font-weight:600}' +
      bodyCss +
      '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}' +
      '</style></head><body>' + parts.join('') +
      '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},250)}<\/scr'+'ipt>' +
      '</body></html>';
    var w = window.open('', '_blank');
    if (!w) { toast('Allow pop-ups to print'); return; }
    w.document.open();
    w.document.write(doc);
    w.document.close();
    // empty title reduces "StoryWriter" in some browser headers
    try { w.document.title = '\u200b'; } catch (e) {}
  }


  // Wire project / disk buttons
  var printBtn = document.getElementById('sw-print-btn');
  if (printBtn) printBtn.onclick = function () { openPrintSetup(); };
  var projBtn = document.getElementById('sw-projects-btn');
  if (projBtn) projBtn.onclick = function () { openProjectsModal(); };
  var diskSave = document.getElementById('sw-disk-save');
  if (diskSave) diskSave.onclick = function () { saveToDisk(); };
  var diskSaveAs = document.getElementById('sw-disk-save-as');
  if (diskSaveAs) diskSaveAs.onclick = function () { saveAsToDisk(); };
  var diskOpen = document.getElementById('sw-disk-open');
  if (diskOpen) diskOpen.onclick = function () { openFromDisk(); };
  updateDiskSaveLabel();

  // Drag-and-drop JSON restore
  ;['dragenter', 'dragover'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if ([].indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
      e.preventDefault();
    });
  });
  window.addEventListener('drop', async function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    var f = e.dataTransfer.files[0];
    if (!f || !/\.json$/i.test(f.name) && f.type !== 'application/json') return;
    e.preventDefault();
    var text = await f.text();
    await importProjectJson(text, f.name);
  });


  // Welcome popup (every open)

  function showWelcomePopup() {
        openModal(
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px">' +
        '<h3 style="margin:0">Welcome to StoryWriter</h3>' +
        '<button type="button" class="sw-btn sw-btn-icon" id="m-welcome-x" title="Close" aria-label="Close" style="flex-shrink:0">×</button>' +
      '</div>' +
      '<p style="margin:0 0 10px;line-height:1.55;color:var(--sw-muted);font-size:0.9rem">' +
        'A free offline writing desk for indie authors. Built by <strong style="color:var(--sw-ink)">Mason Carter</strong>.' +
      '</p>' +
      '<p style="margin:0 0 14px;line-height:1.55;font-size:0.9rem">' +
        'If StoryWriter helps your work, you can support development by buying a book, or leave feature ideas on the project page (roadmap and changelog live there too).' +
      '</p>' +
      '<div class="sw-modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">' +
        '<a class="sw-btn sw-btn-primary" id="m-welcome-books" href="https://www.authormasoncarter.com/p/books-series.html" target="_blank" rel="noopener noreferrer" style="text-decoration:none;justify-content:center;text-align:center">Buy books to support development</a>' +
        '<a class="sw-btn" id="m-welcome-feedback" href="https://www.authormasoncarter.com/2026/09/storywriter-free-offline-writing-app.html" target="_blank" rel="noopener noreferrer" style="text-decoration:none;justify-content:center;text-align:center">Suggest features · roadmap · changelog</a>' +
        '<button type="button" class="sw-btn" id="m-welcome-close">Continue writing</button>' +
      '</div>'
    );
    function closeWelcome() { closeModal(); }
    var x = $('#m-welcome-x');
    var c = $('#m-welcome-close');
    if (x) x.onclick = closeWelcome;
    if (c) c.onclick = closeWelcome;
  }

  // Init (async)
  (async function boot() {
    try {
      await migrateLocalToIdb();
      var meta = readMeta();
      if (meta.currentId) {
        var ok = await loadProjectById(meta.currentId);
        if (!ok) load();
      } else {
        load();
        if (!currentProjectId) {
          currentProjectId = uid();
          currentProjectName = 'My project';
          await persistToIdbPromise();
        }
      }
    } catch (e) {
      load();
    }
    if (!state.goals.sessionBase && state.goals.sessionBase !== 0) state.goals.sessionBase = totalWords();
    if (!state.openThreads) state.openThreads = [];
    refreshUI();

  // Mobile: collapse sidebar by default
  try {
    if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
      ROOT.classList.add('sw-sidebar-collapsed');
    }
  } catch (e) {}

    setTimeout(function () { showWelcomePopup(); }, 400);

    // PWA shortcuts: ?action=new-scene | new-project
    try {
      var params = new URLSearchParams(window.location.search);
      var action = params.get('action');
      if (action === 'new-scene') {
        addScene();
      } else if (action === 'new-project') {
        await createNewProject('Untitled');
      }
      if (action && window.history && window.history.replaceState) {
        window.history.replaceState({}, '', window.location.pathname);
      }
    } catch (e) {}

    window.addEventListener('beforeunload', function () { saveCurrent(); save(); });
  })();

  // PWA: service worker + update toast + install
  if ('serviceWorker' in navigator) {
    var swUrl = new URL('story-writer-sw.js', window.location.href);
    navigator.serviceWorker.register(swUrl.href, { scope: new URL('./', window.location.href).href }).then(function (reg) {
      function promptUpdate() {
        if (!reg.waiting) return;
        openModal(
          '<h3>Update available</h3>' +
          '<p style="margin:0 0 12px;line-height:1.5">A new version of StoryWriter is ready. Reload to use it. Your projects stay in this browser.</p>' +
          '<div class="sw-modal-actions">' +
          '<button type="button" class="sw-btn" id="m-no">Later</button>' +
          '<button type="button" class="sw-btn sw-btn-primary" id="m-yes">Reload</button></div>'
        );
        $('#m-no').onclick = closeModal;
        $('#m-yes').onclick = function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          closeModal();
        };
      }
      if (reg.waiting) promptUpdate();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) promptUpdate();
        });
      });
      setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
    }).catch(function () {});
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    var btn = document.getElementById('sw-install-btn');
    if (btn) btn.style.display = '';
  });
  var installBtn = document.getElementById('sw-install-btn');
  if (installBtn) {
    installBtn.addEventListener('click', function () {
      if (!deferredInstall) {
        toast('Use your browser Install app menu if available');
        return;
      }
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; installBtn.style.display = 'none'; });
    });
  }
  })();
</script>

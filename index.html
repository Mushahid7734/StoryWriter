<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5c4a32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StoryWriter">
  <link rel="manifest" href="story-writer-manifest.webmanifest">
  <link rel="apple-touch-icon" href="story-writer-icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="story-writer-icon-192.png">
  <title>StoryWriter</title>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@400;500;600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f0e8;
    }
    #sw-root {
      --sw-bg: #f4f0e8;
      --sw-paper: #faf7f0;
      --sw-ink: #2c2416;
      --sw-muted: #6b5e4a;
      --sw-accent: #5c4a32;
      --sw-accent-soft: #8b7355;
      --sw-border: #ddd4c4;
      --sw-panel: #ebe4d6;
      --sw-hover: #e0d6c4;
      --sw-tag: #2a5a7a;
      --sw-tag-bg: #e8f0f6;
      --sw-danger: #8b3a2a;
      --sw-ok: #3d6b4f;
      --sw-sidebar-w: 240px;
      --sw-font-size: 16px;
      --sw-radius: 8px;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--sw-ink);
      background: var(--sw-bg);
      line-height: 1.5;
      box-sizing: border-box;
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 0;
      border: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100%;
      height: 100dvh;
      position: fixed;
      inset: 0;
      z-index: 1;
      isolation: isolate;
    }
    #sw-root[data-theme="sepia"] {
      --sw-bg: #f0e6d2;
      --sw-paper: #f7efdc;
      --sw-ink: #3d2f1a;
      --sw-muted: #7a6548;
      --sw-accent: #6b4e2e;
      --sw-accent-soft: #9a7b52;
      --sw-border: #d4c4a8;
      --sw-panel: #e8dcc4;
      --sw-hover: #ddd0b4;
      --sw-tag: #5a4a28;
      --sw-tag-bg: #efe6d0;
    }
    body:has(#sw-root[data-theme="dark"]) { background: #1a1c1e; }
    #sw-root[data-theme="dark"] {
      --sw-bg: #1a1c1e;
      --sw-paper: #232628;
      --sw-ink: #e4e0d8;
      --sw-muted: #9a958c;
      --sw-accent: #c4a574;
      --sw-accent-soft: #a88b5c;
      --sw-border: #3a3e42;
      --sw-panel: #2a2e32;
      --sw-hover: #34383c;
      --sw-tag: #7eb0d4;
      --sw-tag-bg: #2a3a48;
      --sw-danger: #d08070;
      --sw-ok: #7cbc94;
    }
    #sw-root *, #sw-root *::before, #sw-root *::after { box-sizing: border-box; }

    #sw-root .sw-topbar {
      display: flex; align-items: center; gap: 5px; padding: 7px 10px;
      background: var(--sw-panel); border-bottom: 1px solid var(--sw-border);
      flex-shrink: 0; flex-wrap: wrap; position: relative; z-index: 20;
    }
    #sw-root .sw-logo {
      font-family: "EB Garamond", Georgia, serif; font-weight: 600;
      font-size: 1.1rem; color: var(--sw-accent); margin-right: 6px;
    }
    #sw-root .sw-btn {
      font: inherit; font-size: 0.78rem; font-weight: 500;
      border: 1px solid var(--sw-border); background: var(--sw-paper);
      color: var(--sw-ink); border-radius: 6px; padding: 4px 9px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
    }
    #sw-root .sw-btn:hover { background: var(--sw-hover); }
    #sw-root .sw-btn-icon { padding: 4px 7px; min-width: 28px; justify-content: center; }
    #sw-root .sw-btn-primary { background: var(--sw-accent); color: var(--sw-paper); border-color: var(--sw-accent); }
    #sw-root .sw-btn-primary:hover { filter: brightness(1.08); }
    #sw-root .sw-top-sep { width: 1px; height: 20px; background: var(--sw-border); margin: 0 3px; }
    #sw-root .sw-wordcount { font-size: 0.75rem; color: var(--sw-muted); margin-left: auto; }
    #sw-root .sw-goal-wrap {
      display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--sw-muted);
    }
    #sw-root .sw-goal-bar {
      width: 72px; height: 6px; background: var(--sw-border); border-radius: 3px; overflow: hidden;
    }
    #sw-root .sw-goal-fill {
      height: 100%; background: var(--sw-ok); width: 0%; transition: width 0.2s;
    }

    #sw-root .sw-body {
      display: flex; flex: 1; min-height: 0; overflow: hidden; position: relative; z-index: 1;
    }
    #sw-root .sw-sidebar {
      width: var(--sw-sidebar-w); background: var(--sw-panel);
      border-right: 1px solid var(--sw-border); display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden; position: relative; z-index: 15;
    }
    #sw-root.sw-sidebar-collapsed .sw-sidebar { width: 0; border: none; }
    #sw-root .sw-sidebar-inner {
      width: var(--sw-sidebar-w); padding: 8px; display: flex; flex-direction: column;
      height: 100%; overflow: hidden;
    }
    #sw-root .sw-sidebar h3 {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--sw-muted); margin: 0 0 6px; font-weight: 600;
    }
    #sw-root .sw-side-tabs {
      display: flex; gap: 2px; margin-bottom: 8px;
    }
    #sw-root .sw-side-tabs button {
      flex: 1; font-size: 0.72rem; padding: 4px; border: 1px solid var(--sw-border);
      background: transparent; color: var(--sw-muted); border-radius: 4px; cursor: pointer;
    }
    #sw-root .sw-side-tabs button.active {
      background: var(--sw-paper); color: var(--sw-ink); font-weight: 600;
    }
    #sw-root .sw-chapter-list, #sw-root .sw-outline-list {
      flex: 1; overflow-y: auto;
    }
    #sw-root .sw-ch-block { margin-bottom: 6px; }
    #sw-root .sw-chapter-item, #sw-root .sw-scene-item, #sw-root .sw-outline-item {
      display: flex; align-items: center; gap: 4px; padding: 5px 6px;
      border-radius: 5px; cursor: pointer; font-size: 0.82rem; border: 1px solid transparent;
    }
    #sw-root .sw-chapter-item:hover, #sw-root .sw-scene-item:hover, #sw-root .sw-outline-item:hover {
      background: var(--sw-hover);
    }
    #sw-root .sw-chapter-item.active, #sw-root .sw-scene-item.active {
      background: var(--sw-paper); border-color: var(--sw-border); font-weight: 600;
    }
    #sw-root .sw-scene-item { padding-left: 14px; font-size: 0.78rem; color: var(--sw-muted); }
    #sw-root .sw-scene-item.active { color: var(--sw-ink); }
    #sw-root .sw-status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    #sw-root .sw-status-draft { background: #a09070; }
    #sw-root .sw-status-revise { background: #c09040; }
    #sw-root .sw-status-done { background: var(--sw-ok); }
    #sw-root .sw-ch-del, #sw-root .sw-sc-del {
      opacity: 0; background: none; border: none; color: var(--sw-danger);
      cursor: pointer; font-size: 0.85rem; padding: 0 2px; margin-left: auto;
    }
    #sw-root .sw-chapter-item:hover .sw-ch-del,
    #sw-root .sw-scene-item:hover .sw-sc-del { opacity: 1; }
    #sw-root .sw-drag-handle { cursor: grab; color: var(--sw-muted); font-size: 0.7rem; }
    #sw-root .sw-outline-item .sw-out-syn {
      display: block; font-size: 0.72rem; color: var(--sw-muted); font-weight: 400;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #sw-root .sw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--sw-paper); }
    #sw-root .sw-tabs {
      display: flex; border-bottom: 1px solid var(--sw-border); background: var(--sw-panel);
      flex-shrink: 0; overflow-x: auto; position: relative; z-index: 12;
    }
    #sw-root .sw-tab {
      font: inherit; font-size: 0.8rem; font-weight: 500; padding: 8px 12px;
      border: none; background: transparent; color: var(--sw-muted); cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    #sw-root .sw-tab:hover { color: var(--sw-ink); }
    #sw-root .sw-tab.active { color: var(--sw-accent); border-bottom-color: var(--sw-accent); font-weight: 600; }

    #sw-root .sw-panel { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
    #sw-root .sw-panel.active { display: flex; }

    #sw-root .sw-story-toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px;
      border-bottom: 1px solid var(--sw-border); background: var(--sw-bg); align-items: center;
    }
    #sw-root .sw-editor-wrap {
      flex: 1; overflow-y: auto; padding: 20px 8%; background: var(--sw-paper);
    }
    #sw-root .sw-meta-row {
      display: grid; grid-template-columns: 1fr 140px; gap: 10px; max-width: 42em; margin: 0 auto 10px;
    }
    #sw-root .sw-chapter-title-input, #sw-root .sw-scene-title-input {
      width: 100%; border: none; background: transparent;
      font-family: "EB Garamond", Georgia, serif; font-size: 1.45rem; font-weight: 600;
      color: var(--sw-ink); padding: 0 0 6px; border-bottom: 1px solid var(--sw-border); outline: none;
    }
    #sw-root .sw-scene-title-input { font-size: 1.15rem; font-weight: 500; }
    #sw-root .sw-synopsis-input {
      width: 100%; border: 1px solid var(--sw-border); border-radius: 6px;
      background: var(--sw-bg); color: var(--sw-ink); font: inherit; font-size: 0.85rem;
      padding: 6px 8px; margin: 0 auto 12px; max-width: 42em; display: block;
    }
    #sw-root .sw-editor {
      min-height: 280px; outline: none; font-family: "EB Garamond", Georgia, serif;
      font-size: var(--sw-font-size); line-height: 1.75; color: var(--sw-ink);
      max-width: 42em; margin: 0 auto;
    }
    #sw-root .sw-editor:empty:before {
      content: attr(data-placeholder); color: var(--sw-muted); opacity: 0.55;
      font-style: italic; pointer-events: none;
    }
    #sw-root .sw-editor .sw-mention {
      color: var(--sw-tag); text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--sw-tag) 40%, transparent);
      background: var(--sw-tag-bg); border-radius: 3px; padding: 0 2px; cursor: help;
    }

    /* Corkboard */
    #sw-root .sw-corkboard {
      flex: 1; overflow-y: auto; padding: 16px; display: none;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
      align-content: start; background: var(--sw-bg);
    }
    #sw-root .sw-corkboard.active { display: grid; }
    #sw-root .sw-cork-card {
      background: var(--sw-paper); border: 1px solid var(--sw-border); border-radius: 8px;
      padding: 12px; cursor: pointer; min-height: 110px;
    }
    #sw-root .sw-cork-card:hover { border-color: var(--sw-accent-soft); }
    #sw-root .sw-cork-card h4 { margin: 0 0 6px; font-size: 0.95rem; font-family: "EB Garamond", Georgia, serif; }
    #sw-root .sw-cork-card p { margin: 0; font-size: 0.8rem; color: var(--sw-muted); }
    #sw-root .sw-cork-card .sw-cork-status {
      display: inline-block; margin-top: 8px; font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--sw-muted);
    }

    /* Comments panel */
    #sw-root .sw-comments-panel {
      width: 220px; border-left: 1px solid var(--sw-border); background: var(--sw-panel);
      display: none; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    #sw-root.sw-comments-open .sw-comments-panel { display: flex; }
    #sw-root .sw-comments-panel h3 { padding: 8px 10px; margin: 0; font-size: 0.75rem; }
    #sw-root .sw-comments-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    #sw-root .sw-comment-item {
      background: var(--sw-paper); border: 1px solid var(--sw-border); border-radius: 6px;
      padding: 8px; margin-bottom: 6px; font-size: 0.82rem;
    }
    #sw-root .sw-comment-item button {
      background: none; border: none; color: var(--sw-danger); cursor: pointer; font-size: 0.75rem;
    }

    #sw-root .sw-wb-toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid var(--sw-border); background: var(--sw-bg); align-items: center;
    }
    #sw-root .sw-wb-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
    #sw-root .sw-card {
      background: var(--sw-paper); border: 1px solid var(--sw-border); border-radius: var(--sw-radius);
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    }
    #sw-root .sw-card:hover { border-color: var(--sw-accent-soft); }
    #sw-root .sw-card h4 { margin: 0 0 4px; font-size: 0.95rem; font-family: "EB Garamond", Georgia, serif; }
    #sw-root .sw-card p { margin: 0 0 3px; font-size: 0.82rem; color: var(--sw-muted); }
    #sw-root .sw-card-actions { display: flex; gap: 5px; margin-top: 6px; }
    #sw-root .sw-card img.sw-thumb {
      width: 48px; height: 48px; object-fit: cover; border-radius: 6px; float: right; margin-left: 8px;
    }

    #sw-root label.sw-lbl {
      display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--sw-muted); margin-bottom: 2px;
    }
    #sw-root input.sw-inp, #sw-root textarea.sw-ta, #sw-root select.sw-sel {
      width: 100%; padding: 6px 8px; border: 1px solid var(--sw-border); border-radius: 6px;
      font: inherit; font-size: 0.88rem; background: var(--sw-paper); color: var(--sw-ink);
    }
    #sw-root textarea.sw-ta { min-height: 56px; resize: vertical; }
    #sw-root .sw-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    #sw-root .sw-chip {
      font-size: 0.72rem; padding: 2px 7px; border-radius: 10px; border: 1px dashed var(--sw-border);
      background: var(--sw-paper); color: var(--sw-muted); cursor: pointer;
    }
    #sw-root .sw-chip:hover { border-color: var(--sw-accent); color: var(--sw-accent); }

    #sw-root .sw-modal-bg {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 10000; align-items: center; justify-content: center; padding: 14px;
    }
    #sw-root .sw-modal-bg.open { display: flex; }
    #sw-root .sw-modal {
      background: var(--sw-paper); border-radius: 10px; border: 1px solid var(--sw-border);
      max-width: 520px; width: 100%; max-height: 88%; overflow-y: auto; padding: 16px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2); color: var(--sw-ink);
    }
    #sw-root .sw-modal h3 { margin: 0 0 10px; font-family: "EB Garamond", Georgia, serif; font-size: 1.2rem; }
    #sw-root .sw-modal-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    #sw-root .sw-detail-grid { display: grid; gap: 8px; margin: 6px 0; }
    #sw-root .sw-detail-row strong {
      display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--sw-muted); margin-bottom: 2px;
    }
    #sw-root .sw-detail-row p { margin: 0; font-size: 0.9rem; white-space: pre-wrap; }

    #sw-root .sw-ac {
      display: none; position: absolute; z-index: 10040; background: var(--sw-paper);
      border: 1px solid var(--sw-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      max-height: 200px; overflow-y: auto; min-width: 200px;
    }
    #sw-root .sw-ac.open { display: block; }
    #sw-root .sw-ac-item {
      padding: 7px 10px; cursor: pointer; font-size: 0.84rem; display: flex; gap: 6px;
    }
    #sw-root .sw-ac-item:hover, #sw-root .sw-ac-item.active { background: var(--sw-tag-bg); }
    #sw-root .sw-ac-type { font-size: 0.65rem; text-transform: uppercase; color: var(--sw-muted); min-width: 48px; }

    #sw-root .sw-hover-panel {
      display: none; position: absolute; z-index: 10050; background: var(--sw-paper);
      border: 1px solid var(--sw-border); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.15);
      padding: 12px 14px; max-width: 300px; font-size: 0.84rem;
    }
    #sw-root .sw-hover-panel.open { display: block; }
    #sw-root .sw-hover-panel h4 {
      margin: 0 0 4px; font-family: "EB Garamond", Georgia, serif; font-size: 1.05rem; color: var(--sw-accent);
    }
    #sw-root .sw-hp-type { font-size: 0.65rem; text-transform: uppercase; color: var(--sw-muted); margin-bottom: 6px; }

    #sw-root .sw-dict {
      display: none; position: absolute; z-index: 10060; background: var(--sw-paper);
      border: 1px solid var(--sw-border); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.15);
      padding: 10px 12px; max-width: 280px; min-width: 180px; font-size: 0.82rem;
    }
    #sw-root .sw-dict.open { display: block; }
    #sw-root .sw-dict h5 {
      margin: 0 0 4px; font-size: 0.68rem; text-transform: uppercase; color: var(--sw-muted);
    }
    #sw-root .sw-dict-words { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
    #sw-root .sw-dict-words button {
      font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--sw-border);
      background: var(--sw-bg); cursor: pointer; color: var(--sw-ink);
    }

    #sw-root .sw-toast {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(50px);
      background: var(--sw-accent); color: var(--sw-paper); padding: 7px 14px; border-radius: 6px;
      font-size: 0.82rem; opacity: 0; transition: all 0.25s; z-index: 10070; pointer-events: none;
    }
    #sw-root .sw-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #sw-root .sw-brainstorm { flex: 1; padding: 12px 16px; overflow-y: auto; }
    #sw-root .sw-brainstorm textarea {
      width: 100%; min-height: 260px; border: 1px solid var(--sw-border); border-radius: 8px;
      padding: 12px; font-family: "EB Garamond", Georgia, serif; font-size: 1.02rem;
      line-height: 1.65; background: var(--sw-paper); color: var(--sw-ink); resize: vertical;
    }

    #sw-root .sw-dropdown {
      position: relative; display: inline-block;
    }
    #sw-root .sw-dropdown-menu {
      display: none; position: absolute; top: 100%; right: 0; margin-top: 4px;
      background: var(--sw-paper); border: 1px solid var(--sw-border); border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12); min-width: 180px; z-index: 100;
    }
    #sw-root .sw-dropdown.open .sw-dropdown-menu { display: block; }
    #sw-root .sw-dropdown-menu button {
      display: block; width: 100%; text-align: left; border: none; background: none;
      padding: 8px 12px; font: inherit; font-size: 0.82rem; color: var(--sw-ink); cursor: pointer;
    }
    #sw-root .sw-dropdown-menu button:hover { background: var(--sw-hover); }

    #sw-root:fullscreen, #sw-root:-webkit-full-screen {
      max-width: none !important; width: 100% !important; height: 100% !important;
      border-radius: 0 !important; overflow: hidden !important;
      display: flex !important; flex-direction: column !important;
    }
    #sw-root:fullscreen .sw-topbar, #sw-root:-webkit-full-screen .sw-topbar,
    #sw-root:fullscreen .sw-tabs, #sw-root:-webkit-full-screen .sw-tabs {
      display: flex !important; flex-shrink: 0 !important;
    }
    #sw-root:fullscreen .sw-body, #sw-root:-webkit-full-screen .sw-body {
      display: flex !important; flex: 1 1 auto !important; min-height: 0 !important; overflow: hidden !important;
    }


    #sw-root.sw-typewriter .sw-editor-wrap {
      padding-top: 28vh;
      padding-bottom: 45vh;
      scroll-behavior: auto;
    }
    #sw-root.sw-typewriter .sw-editor {
      min-height: 50vh;
    }
    #sw-root .sw-ref-panel {
      width: 0; overflow: hidden; border-left: none; background: var(--sw-panel);
      flex-shrink: 0; transition: width 0.15s; display: flex; flex-direction: column;
    }
    #sw-root.sw-ref-open .sw-ref-panel {
      width: 260px; border-left: 1px solid var(--sw-border); overflow: hidden;
    }
    #sw-root .sw-ref-panel h3 {
      margin: 0; padding: 8px 10px; font-size: 0.75rem; border-bottom: 1px solid var(--sw-border);
    }
    #sw-root .sw-ref-body {
      flex: 1; overflow-y: auto; padding: 10px; font-size: 0.84rem;
    }
    #sw-root .sw-threads-bar {
      display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px;
      border-bottom: 1px solid var(--sw-border); background: var(--sw-bg); align-items: center;
    }
    #sw-root.sw-threads-open .sw-threads-bar { display: flex; }
    #sw-root .sw-thread-chip {
      font-size: 0.72rem; padding: 3px 8px; border-radius: 12px;
      background: var(--sw-paper); border: 1px solid var(--sw-border); color: var(--sw-ink);
    }
    #sw-root .sw-thread-chip button {
      border: none; background: none; color: var(--sw-danger); cursor: pointer; margin-left: 4px;
    }

  </style>
</head>
<body>
<div id="sw-root" data-theme="parchment">
  <div class="sw-topbar">
    <span class="sw-logo">StoryWriter</span>
    <button type="button" class="sw-btn sw-btn-icon" id="sw-toggle-sidebar" title="Toggle sidebar (Ctrl+B)">☰</button>

    <div class="sw-top-sep"></div>
    <button type="button" class="sw-btn sw-btn-icon" id="sw-fullscreen" title="Fullscreen">⛶</button>
    <button type="button" class="sw-btn" id="sw-projects-btn" title="Projects">Projects</button>
    <button type="button" class="sw-btn" id="sw-disk-save" title="Save to disk">Save disk</button>
    <button type="button" class="sw-btn" id="sw-disk-open" title="Open from disk">Open disk</button>
    <button type="button" class="sw-btn" id="sw-install-btn" title="Install as app" style="display:none">Install app</button>
    <span id="sw-project-label" style="font-size:0.75rem;color:var(--sw-muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <div class="sw-top-sep"></div>
    <div class="sw-dropdown" id="sw-export-dd">
      <button type="button" class="sw-btn sw-btn-primary" id="sw-export-btn">Export ▾</button>
      <div class="sw-dropdown-menu">

    <button type="button" class="sw-btn" id="sw-restore-btn">Restore</button>
    <button type="button" class="sw-btn" id="sw-template-btn">Template</button>
    <button type="button" class="sw-btn" id="sw-clear-data">Clear</button>
    <input type="file" id="sw-restore-file" accept=".json,application/json" style="display:none">
    <div class="sw-goal-wrap" title="Session goal">
      <span id="sw-goal-label">0/500</span>
      <div class="sw-goal-bar"><div class="sw-goal-fill" id="sw-goal-fill"></div></div>
    </div>
    <span class="sw-wordcount" id="sw-wordcount">0 words</span>
  </div>
  <div class="sw-body">
    <aside class="sw-sidebar" id="sw-sidebar">
      <div class="sw-sidebar-inner">
        <div class="sw-side-tabs">
          <button type="button" class="active" data-side="chapters">Chapters</button>
          <button type="button" data-side="outline">Outline</button>
        </div>
        <div id="sw-side-chapters">
          <button type="button" class="sw-btn sw-btn-primary" id="sw-add-chapter" style="width:100%;margin-bottom:6px;">+ Chapter</button>
          <button type="button" class="sw-btn" id="sw-add-scene" style="width:100%;margin-bottom:8px;">+ Scene</button>
          <div class="sw-chapter-list" id="sw-chapter-list"></div>
        </div>
        <div id="sw-side-outline" style="display:none;">
          <div class="sw-outline-list" id="sw-outline-list"></div>
        </div>

    </aside>

    <div class="sw-main">
      <div class="sw-tabs" id="sw-tabs">
        <button type="button" class="sw-tab active" data-tab="story">Story</button>
        <button type="button" class="sw-tab" data-tab="locations">Locations</button>

        <button type="button" class="sw-tab" data-tab="religions">Religions</button>

        <button type="button" class="sw-tab" data-tab="brainstorm">Brainstorm</button>
      </div>

      <div class="sw-panel active" id="sw-panel-story">
        <div class="sw-story-toolbar">
          <button type="button" class="sw-btn" id="sw-view-write">Write</button>
          <button type="button" class="sw-btn" id="sw-view-cork">Corkboard</button>
          <button type="button" class="sw-btn" id="sw-toggle-comments">Notes</button>
          <button type="button" class="sw-btn" id="sw-add-comment">+ Note</button>
          <button type="button" class="sw-btn" id="sw-snapshot-btn">Snapshot</button>
          <button type="button" class="sw-btn" id="sw-snapshots-list-btn">Snapshots</button>
          <label class="sw-lbl" style="margin:0 0 0 8px;">Status</label>
          <select class="sw-sel" id="sw-status-sel" style="width:auto;min-width:90px;">
            <option value="draft">Draft</option>
            <option value="revise">Revise</option>

          <button type="button" class="sw-btn" id="sw-goals-btn">Goals</button>
          <button type="button" class="sw-btn" id="sw-typewriter-btn" title="Typewriter scroll">Typewriter</button>

        <div style="display:flex;flex:1;min-height:0;">

            <div class="sw-editor-wrap" id="sw-write-view">

              <input type="text" class="sw-scene-title-input" id="sw-scene-title" placeholder="Scene title…">

            <div class="sw-ref-body" id="sw-ref-body"><p style="color:var(--sw-muted);font-size:0.82rem">Hover an @ tag and click Pin, or use Pin ref.</p></div>

      <div class="sw-panel" id="sw-panel-locations">
        <div class="sw-wb-toolbar">
          <button type="button" class="sw-btn sw-btn-primary" id="sw-loc-add">+ Location</button>
          <button type="button" class="sw-btn" id="sw-loc-docx">DOCX</button>
        </div>
        <div class="sw-wb-list" id="sw-loc-list"></div>
      </div>
      <div class="sw-panel" id="sw-panel-characters">
        <div class="sw-wb-toolbar">
          <button type="button" class="sw-btn sw-btn-primary" id="sw-char-add">+ Character</button>
          <button type="button" class="sw-btn" id="sw-char-docx">DOCX</button>
        </div>
        <div class="sw-wb-list" id="sw-char-list"></div>
      </div>
      <div class="sw-panel" id="sw-panel-religions">
        <div class="sw-wb-toolbar">
          <button type="button" class="sw-btn sw-btn-primary" id="sw-rel-add">+ Religion</button>
          <button type="button" class="sw-btn" id="sw-rel-docx">DOCX</button>
        </div>
        <div class="sw-wb-list" id="sw-rel-list"></div>
      </div>
      <div class="sw-panel" id="sw-panel-planets">
        <div class="sw-wb-toolbar">
          <button type="button" class="sw-btn sw-btn-primary" id="sw-pl-add">+ Planet</button>
          <button type="button" class="sw-btn" id="sw-pl-docx">DOCX</button>
        </div>
        <div class="sw-wb-list" id="sw-pl-list"></div>
      </div>
      <div class="sw-panel" id="sw-panel-brainstorm">
        <div class="sw-wb-toolbar">
          <button type="button" class="sw-btn" id="sw-brain-docx">DOCX</button>

  <div class="sw-ac" id="sw-ac"></div>
  <div class="sw-hover-panel" id="sw-hover"></div>
  <div class="sw-dict" id="sw-dict"></div>
  <div class="sw-modal-bg" id="sw-modal-bg"><div class="sw-modal" id="sw-modal"></div></div>
  <div class="sw-toast" id="sw-toast"></div>
</div>
<script>
(function () {
  const ROOT = document.getElementById('sw-root');
  if (!ROOT) return;
  const STORAGE_KEY = 'storywriter-v2';
  const LEGACY_KEY = 'storywriter-v1';
  const META_KEY = 'storywriter-meta-v1';
  const IDB_NAME = 'storywriter-db';
  const IDB_STORE = 'projects';

  function uid() { return 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  let currentProjectId = null;
  let currentProjectName = 'Untitled';
  let idbSaveTimer = null;
  let fileHandle = null; // File System Access handle when available

  function openIdb() {
    return new Promise(function (resolve, reject) {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbPut(record) {
    return openIdb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(record);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbGet(id) {
    return openIdb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function idbDelete(id) {
    return openIdb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbAll() {
    return openIdb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function readMeta() {
    try {
      return JSON.parse(localStorage.getItem(META_KEY) || '{}') || {};
    } catch (e) { return {}; }
  }
  function writeMeta(meta) {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
  }
  function updateProjectLabel() {
    const el = document.getElementById('sw-project-label');
    if (el) el.textContent = currentProjectName || 'Untitled';
  }

  function emptyScene(title) {
    return { id: uid(), title: title || 'Scene 1', synopsis: '', status: 'draft', content: '', comments: [], snapshots: [] };
  }
  function emptyChapter(title, n) {
    return { id: uid(), title: title || ('Chapter ' + (n || 1)), synopsis: '', status: 'draft', scenes: [emptyScene('Scene 1')] };
  }

  let state = {
    version: 2,
    theme: 'parchment',
    fontSize: 16,
    chapters: [emptyChapter('Chapter 1', 1)],
    activeChapterId: null,
    activeSceneId: null,
    locations: [],
    characters: [],
    religions: [],
    planets: [],
    brainstorm: '',
    goals: { sessionTarget: 500, sessionBase: 0, draftTarget: 80000 },
    viewMode: 'write',
    openThreads: [],
    pinnedRef: null,
    typewriter: false
  };
  state.activeChapterId = state.chapters[0].id;
  state.activeSceneId = state.chapters[0].scenes[0].id;
  state.goals.sessionBase = 0;

  const $ = (s) => ROOT.querySelector(s);
  const $$ = (s) => Array.from(ROOT.querySelectorAll(s));

  const editor = $('#sw-editor');
  const chapterTitle = $('#sw-chapter-title');
  const sceneTitle = $('#sw-scene-title');
  const synopsisEl = $('#sw-synopsis');
  const chapterList = $('#sw-chapter-list');
  const outlineList = $('#sw-outline-list');
  const wordcountEl = $('#sw-wordcount');
  const goalLabel = $('#sw-goal-label');
  const goalFill = $('#sw-goal-fill');
  const acEl = $('#sw-ac');
  const hoverEl = $('#sw-hover');
  const dictEl = $('#sw-dict');
  const modalBg = $('#sw-modal-bg');
  const modalEl = $('#sw-modal');
  const toastEl = $('#sw-toast');
  const corkboard = $('#sw-corkboard');
  const writeView = $('#sw-write-view');
  const statusSel = $('#sw-status-sel');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function wordCount(html) {
    const t = (html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    return t ? t.split(/\s+/).length : 0;
  }
  function totalWords() {
    let n = 0;
    state.chapters.forEach(ch => ch.scenes.forEach(sc => { n += wordCount(sc.content); }));
    return n;
  }
  function getActiveChapter() {
    return state.chapters.find(c => c.id === state.activeChapterId) || state.chapters[0];
  }
  function getActiveScene() {
    const ch = getActiveChapter();
    if (!ch) return null;
    return ch.scenes.find(s => s.id === state.activeSceneId) || ch.scenes[0];
  }

  function updateWordcount() {
    const sc = getActiveScene();
    const w = sc ? wordCount(sc.content) : 0;
    const tot = totalWords();
    wordcountEl.textContent = w + ' words | ' + tot + ' total';
    const session = Math.max(0, tot - (state.goals.sessionBase || 0));
    const target = state.goals.sessionTarget || 500;
    goalLabel.textContent = session + '/' + target;
    goalFill.style.width = Math.min(100, (session / target) * 100) + '%';
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const meta = readMeta();
      meta.currentId = currentProjectId;
      writeMeta(meta);
    } catch (e) { toast('Could not save'); }
    if (idbSaveTimer) clearTimeout(idbSaveTimer);
    idbSaveTimer = setTimeout(function () { persistToIdb(); }, 400);
  }

  function persistToIdb() {
    if (!currentProjectId) {
      currentProjectId = uid();
      currentProjectName = currentProjectName || 'Untitled';
    }
    const record = {
      id: currentProjectId,
      name: currentProjectName || 'Untitled',
      updatedAt: new Date().toISOString(),
      state: state
    };
    idbPut(record).then(function () {
      const meta = readMeta();
      const list = meta.list || [];
      const i = list.findIndex(function (x) { return x.id === currentProjectId; });
      const entry = { id: currentProjectId, name: record.name, updatedAt: record.updatedAt };
      if (i >= 0) list[i] = entry; else list.unshift(entry);
      meta.list = list;
      meta.currentId = currentProjectId;
      writeMeta(meta);
      updateProjectLabel();
    }).catch(function () {});
  }

  function migrateV1(d) {
    const chapters = (d.chapters || []).map((ch, i) => ({
      id: ch.id || uid(),
      title: ch.title || ('Chapter ' + (i + 1)),
      synopsis: '',
      status: 'draft',
      scenes: [{
        id: uid(),
        title: 'Scene 1',
        synopsis: '',
        status: 'draft',
        content: ch.content || '',
        comments: [],
        snapshots: []
      }]
    }));
    if (!chapters.length) chapters.push(emptyChapter('Chapter 1', 1));
    return {
      version: 2,
      theme: 'parchment',
      fontSize: d.fontSize || 16,
      chapters,
      activeChapterId: chapters[0].id,
      activeSceneId: chapters[0].scenes[0].id,
      locations: d.locations || [],
      characters: d.characters || [],
      religions: d.religions || [],
      planets: d.planets || [],
      brainstorm: d.brainstorm || '',
      goals: { sessionTarget: 500, sessionBase: 0, draftTarget: 80000 },
      viewMode: 'write'
    };
  }

  function load() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const leg = localStorage.getItem(LEGACY_KEY);
        if (leg) {
          state = migrateV1(JSON.parse(leg));
          save();
          return;
        }
        return;
      }
      const d = JSON.parse(raw);
      if (!d.version || d.version < 2) {
        state = migrateV1(d);
        return;
      }
      state = Object.assign(state, d);
      if (!state.chapters || !state.chapters.length) state.chapters = [emptyChapter('Chapter 1', 1)];
      state.chapters.forEach(ch => {
        if (!ch.scenes || !ch.scenes.length) {
          ch.scenes = [emptyScene('Scene 1')];
          if (ch.content) { ch.scenes[0].content = ch.content; delete ch.content; }
        }
        ch.scenes.forEach(sc => {
          if (!sc.comments) sc.comments = [];
          if (!sc.snapshots) sc.snapshots = [];
          if (!sc.status) sc.status = 'draft';
        });
        if (!ch.status) ch.status = 'draft';
      });
      if (!state.goals) state.goals = { sessionTarget: 500, sessionBase: 0, draftTarget: 80000 };
      if (state.goals.sessionBase == null) state.goals.sessionBase = totalWords();
      if (!state.chapters.find(c => c.id === state.activeChapterId)) {
        state.activeChapterId = state.chapters[0].id;
      }
      const ch = getActiveChapter();
      if (!ch.scenes.find(s => s.id === state.activeSceneId)) {
        state.activeSceneId = ch.scenes[0].id;
      }
    } catch (e) {}
  }

  function normalizeState(d) {
    if (!d) return;
    if (!d.version || d.version < 2) {
      state = migrateV1(d);
    } else {
      state = Object.assign(state, d);
    }
    if (!state.chapters || !state.chapters.length) state.chapters = [emptyChapter('Chapter 1', 1)];
    state.chapters.forEach(function (ch) {
      if (!ch.scenes || !ch.scenes.length) {
        ch.scenes = [emptyScene('Scene 1')];
        if (ch.content) { ch.scenes[0].content = ch.content; delete ch.content; }
      }
      ch.scenes.forEach(function (sc) {
        if (!sc.comments) sc.comments = [];
        if (!sc.snapshots) sc.snapshots = [];
        if (!sc.status) sc.status = 'draft';
      });
      if (!ch.status) ch.status = 'draft';
    });
    if (!state.goals) state.goals = { sessionTarget: 500, sessionBase: 0, draftTarget: 80000 };
    if (!state.openThreads) state.openThreads = [];
    if (!state.chapters.find(function (c) { return c.id === state.activeChapterId; })) {
      state.activeChapterId = state.chapters[0].id;
    }
    var ch = getActiveChapter();
    if (!ch.scenes.find(function (s) { return s.id === state.activeSceneId; })) {
      state.activeSceneId = ch.scenes[0].id;
    }
  }

  async function migrateLocalToIdb() {
    var meta = readMeta();
    if (meta.migrated) return;
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      var leg = localStorage.getItem(LEGACY_KEY);
      if (leg) {
        normalizeState(migrateV1(JSON.parse(leg)));
      }
    } else {
      try { normalizeState(JSON.parse(raw)); } catch (e) {}
    }
    if (!currentProjectId) currentProjectId = uid();
    if (!currentProjectName) currentProjectName = 'My project';
    await persistToIdbPromise();
    meta = readMeta();
    meta.migrated = true;
    meta.currentId = currentProjectId;
    writeMeta(meta);
  }

  function persistToIdbPromise() {
    if (!currentProjectId) currentProjectId = uid();
    var record = {
      id: currentProjectId,
      name: currentProjectName || 'Untitled',
      updatedAt: new Date().toISOString(),
      state: state
    };
    return idbPut(record).then(function () {
      var meta = readMeta();
      var list = meta.list || [];
      var i = list.findIndex(function (x) { return x.id === currentProjectId; });
      var entry = { id: currentProjectId, name: record.name, updatedAt: record.updatedAt };
      if (i >= 0) list[i] = entry; else list.unshift(entry);
      meta.list = list;
      meta.currentId = currentProjectId;
      writeMeta(meta);
      updateProjectLabel();
    });
  }

  async function loadProjectById(id) {
    var rec = await idbGet(id);
    if (!rec) return false;
    currentProjectId = rec.id;
    currentProjectName = rec.name || 'Untitled';
    normalizeState(rec.state || {});
    var meta = readMeta();
    meta.currentId = id;
    writeMeta(meta);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    updateProjectLabel();
    return true;
  }

  async function createNewProject(name) {
    saveCurrent();
    await persistToIdbPromise();
    currentProjectId = uid();
    currentProjectName = name || 'Untitled';
    state = {
      version: 2,
      theme: state.theme || 'parchment',
      fontSize: state.fontSize || 16,
      chapters: [emptyChapter('Chapter 1', 1)],
      activeChapterId: null,
      activeSceneId: null,
      locations: [],
      characters: [],
      religions: [],
      planets: [],
      brainstorm: '',
      goals: { sessionTarget: 500, sessionBase: 0, draftTarget: 80000 },
      viewMode: 'write',
      openThreads: [],
      pinnedRef: null,
      typewriter: false
    };
    state.activeChapterId = state.chapters[0].id;
    state.activeSceneId = state.chapters[0].scenes[0].id;
    await persistToIdbPromise();
    refreshUI();
    toast('New project');
  }

    applyFontSize();
    ROOT.classList.toggle('sw-typewriter', !!state.typewriter);
    if (state.pinnedRef) ROOT.classList.add('sw-ref-open');
    else ROOT.classList.remove('sw-ref-open');

  async function openProjectsModal() {
    var list = [];
    try {
      var all = await idbAll();
      list = all.sort(function (a, b) {
        return (b.updatedAt || '').localeCompare(a.updatedAt || '');
      });
    } catch (e) {
      list = (readMeta().list || []).map(function (x) { return { id: x.id, name: x.name, updatedAt: x.updatedAt }; });
    }
    var htmlBody = '<h3>Projects</h3>';
    if (!list.length) htmlBody += '<p style="color:var(--sw-muted);font-size:0.88rem">No saved projects in this browser yet.</p>';
    list.forEach(function (p) {
      var active = p.id === currentProjectId ? ' (current)' : '';
      htmlBody += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;padding:8px;border:1px solid var(--sw-border);border-radius:8px">' +
        '<div style="flex:1;min-width:0"><strong>' + escapeHtml(p.name || 'Untitled') + '</strong>' + active +
        '<div style="font-size:0.72rem;color:var(--sw-muted)">' + escapeHtml((p.updatedAt || '').slice(0, 19).replace('T', ' ')) + '</div></div>' +
        '<button type="button" class="sw-btn sw-open-proj" data-id="' + p.id + '">Open</button>' +
        '<button type="button" class="sw-btn sw-ren-proj" data-id="' + p.id + '">Rename</button>' +
        '<button type="button" class="sw-btn sw-del-proj" data-id="' + p.id + '">Delete</button></div>';
    });
    htmlBody += '<div class="sw-modal-actions" style="justify-content:stretch;flex-direction:column">' +
      '<button type="button" class="sw-btn sw-btn-primary" id="m-new-proj">New project</button>' +
      '<button type="button" class="sw-btn" id="m-cancel">Close</button></div>';
    openModal(htmlBody);
    $('#m-cancel').onclick = closeModal;
    $('#m-new-proj').onclick = async function () {
      var name = await swPrompt('Project name', 'Untitled');
      if (name === null) return;
      closeModal();
      await createNewProject(name.trim() || 'Untitled');
    };
    ROOT.querySelectorAll('.sw-open-proj').forEach(function (btn) {
      btn.onclick = async function () {
        saveCurrent();
        await persistToIdbPromise();
        var ok = await loadProjectById(btn.dataset.id);
        closeModal();
        if (ok) { refreshUI(); toast('Opened project'); }
        else toast('Could not open');
      };
    });
    ROOT.querySelectorAll('.sw-ren-proj').forEach(function (btn) {
      btn.onclick = async function () {
        var name = await swPrompt('Rename project', currentProjectName);
        if (!name) return;
        if (btn.dataset.id === currentProjectId) currentProjectName = name.trim();
        var rec = await idbGet(btn.dataset.id);
        if (rec) {
          rec.name = name.trim();
          rec.updatedAt = new Date().toISOString();
          await idbPut(rec);
        }
        var meta = readMeta();
        (meta.list || []).forEach(function (x) {
          if (x.id === btn.dataset.id) x.name = name.trim();
        });
        writeMeta(meta);
        updateProjectLabel();
        openProjectsModal();
      };
    });
    ROOT.querySelectorAll('.sw-del-proj').forEach(function (btn) {
      btn.onclick = async function () {
        if (!(await swConfirm('Delete this project permanently from this browser?'))) return;
        await idbDelete(btn.dataset.id);
        var meta = readMeta();
        meta.list = (meta.list || []).filter(function (x) { return x.id !== btn.dataset.id; });
        if (meta.currentId === btn.dataset.id) meta.currentId = null;
        writeMeta(meta);
        if (btn.dataset.id === currentProjectId) {
          await createNewProject('Untitled');
        }
        openProjectsModal();
      };
    });
  }

  async function saveToDisk() {
    saveCurrent();
    await persistToIdbPromise();
    var payload = JSON.stringify({
      storywriterProject: 1,
      id: currentProjectId,
      name: currentProjectName,
      updatedAt: new Date().toISOString(),
      state: state
    }, null, 2);
    var blob = new Blob([payload], { type: 'application/json' });
    if (window.showSaveFilePicker) {
      try {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: (currentProjectName || 'storywriter').replace(/[^a-z0-9-_]+/gi, '_') + '.json',
          types: [{ description: 'StoryWriter project', accept: { 'application/json': ['.json'] } }]
        });
        var w = await fileHandle.createWritable();
        await w.write(blob);
        await w.close();
        toast('Saved to disk');
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    saveAs(blob, (currentProjectName || 'storywriter') + '.json');
    toast('Downloaded project JSON');
  }

  async function openFromDisk() {
    if (window.showOpenFilePicker) {
      try {
        var handles = await window.showOpenFilePicker({
          types: [{ description: 'StoryWriter JSON', accept: { 'application/json': ['.json'] } }],
          multiple: false
        });
        var file = await handles[0].getFile();
        var text = await file.text();
        await importProjectJson(text, file.name);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async function () {
      var f = input.files[0];
      if (!f) return;
      var text = await f.text();
      await importProjectJson(text, f.name);
    };
    input.click();
  }

  async function importProjectJson(text, filename) {
    try {
      var data = JSON.parse(text);
      var st = data.state || data;
      if (!st.chapters && data.chapters) st = data;
      if (!(await swConfirm('Replace the current project with this file?'))) return;
      saveCurrent();
      await persistToIdbPromise();
      currentProjectId = uid();
      currentProjectName = data.name || (filename || 'Imported').replace(/\.json$/i, '');
      normalizeState(st);
      await persistToIdbPromise();
      refreshUI();
      toast('Project imported');
    } catch (e) {
      toast('Invalid project file');
    }
  }

  // ----- Sidebar -----
  let dragSceneId = null;

  function renderChapters() {
    chapterList.innerHTML = '';
    state.chapters.forEach((ch, ci) => {
      const block = document.createElement('div');
      block.className = 'sw-ch-block';
      const head = document.createElement('div');
      head.className = 'sw-chapter-item' + (ch.id === state.activeChapterId ? ' active' : '');
      head.innerHTML = '<span class="sw-status-dot sw-status-' + (ch.status || 'draft') + '"></span>' +
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(ch.title) + '</span>' +
        '<button type="button" class="sw-ch-del" data-id="' + ch.id + '">×</button>';
      head.addEventListener('click', (e) => {
        if (e.target.classList.contains('sw-ch-del')) return;
        switchChapter(ch.id);
      });
      block.appendChild(head);
      ch.scenes.forEach((sc) => {
        const row = document.createElement('div');
        row.className = 'sw-scene-item' + (sc.id === state.activeSceneId && ch.id === state.activeChapterId ? ' active' : '');
        row.draggable = true;
        row.dataset.sceneId = sc.id;
        row.dataset.chapterId = ch.id;
        row.innerHTML = '<span class="sw-drag-handle">⠿</span>' +
          '<span class="sw-status-dot sw-status-' + (sc.status || 'draft') + '"></span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(sc.title || 'Scene') + '</span>' +
          '<button type="button" class="sw-sc-del" data-sid="' + sc.id + '" data-cid="' + ch.id + '">×</button>';
        row.addEventListener('click', (e) => {
          if (e.target.classList.contains('sw-sc-del')) return;
          switchScene(ch.id, sc.id);
        });
        row.addEventListener('dragstart', () => { dragSceneId = sc.id; row.style.opacity = '0.5'; });
        row.addEventListener('dragend', () => { row.style.opacity = '1'; dragSceneId = null; });
        row.addEventListener('dragover', (e) => { e.preventDefault(); });
        row.addEventListener('drop', (e) => {
          e.preventDefault();
          if (!dragSceneId || dragSceneId === sc.id) return;
          reorderScene(ch.id, dragSceneId, sc.id);
        });
        block.appendChild(row);
      });
      chapterList.appendChild(block);
    });
    chapterList.querySelectorAll('.sw-ch-del').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); deleteChapter(btn.dataset.id); });
    });
    chapterList.querySelectorAll('.sw-sc-del').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); deleteScene(btn.dataset.cid, btn.dataset.sid); });
    });
    renderOutline();

  function renderOutline() {
    outlineList.innerHTML = '';

      item.addEventListener('click', () => switchChapter(ch.id));

        s.addEventListener('click', () => switchScene(ch.id, sc.id));

      });

  function reorderScene(chapterId, fromId, toId) {
    const ch = state.chapters.find(c => c.id === chapterId);
    if (!ch) return;
    const fromIdx = ch.scenes.findIndex(s => s.id === fromId);
    const toIdx = ch.scenes.findIndex(s => s.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = ch.scenes.splice(fromIdx, 1);
    ch.scenes.splice(toIdx, 0, moved);
    renderChapters();
    save();
  }

  function saveCurrent() {
    const ch = getActiveChapter();
    const sc = getActiveScene();
    if (!ch || !sc) return;
    ch.title = chapterTitle.value.trim() || ch.title;
    ch.synopsis = ch.synopsis; // chapter synopsis via outline - keep scene syn as primary
    sc.title = sceneTitle.value.trim() || sc.title;
    sc.synopsis = synopsisEl.value.trim();
    sc.content = editor.innerHTML;
    sc.status = statusSel.value || sc.status;
    ch.status = sc.status; // mirror active scene status to chapter for sidebar dot simplicity
  }

  function loadIntoEditor() {
    const ch = getActiveChapter();
    const sc = getActiveScene();
    if (!ch || !sc) return;
    chapterTitle.value = ch.title || '';
    sceneTitle.value = sc.title || '';
    synopsisEl.value = sc.synopsis || '';
    editor.innerHTML = sc.content || '';
    statusSel.value = sc.status || 'draft';
    updateWordcount();
    renderComments();
    if (state.viewMode === 'cork') renderCorkboard();

  async function deleteChapter(id) {
    if (state.chapters.length <= 1) { toast('Keep at least one chapter'); return; }
    if (!(await swConfirm('Delete this chapter and all its scenes?'))) return;
    state.chapters = state.chapters.filter(c => c.id !== id);
    if (state.activeChapterId === id) {
      state.activeChapterId = state.chapters[0].id;
      state.activeSceneId = state.chapters[0].scenes[0].id;
      loadIntoEditor();
    }
    renderChapters();
    save();
  }
  async function deleteScene(cid, sid) {
    const ch = state.chapters.find(c => c.id === cid);
    if (!ch || ch.scenes.length <= 1) { toast('Keep at least one scene'); return; }
    if (!(await swConfirm('Delete this scene?'))) return;
    ch.scenes = ch.scenes.filter(s => s.id !== sid);
    if (state.activeSceneId === sid) {
      state.activeSceneId = ch.scenes[0].id;
      loadIntoEditor();
    }

    save();

  // ----- @ mentions (same pattern) -----
  let acIndex = 0, acItems = [];
  function getMentionables() {
    const list = [];
    state.characters.forEach(c => list.push({ type: 'character', id: c.id, name: c.name, data: c }));
    state.locations.forEach(l => list.push({ type: 'location', id: l.id, name: l.name, data: l }));
    state.planets.forEach(p => list.push({ type: 'planet', id: p.id, name: p.name, data: p }));
    state.religions.forEach(r => list.push({ type: 'religion', id: r.id, name: r.name, data: r }));
    return list.filter(x => x.name);
  }
  function showAutocomplete(query, rect) {
    const q = query.toLowerCase();
    acItems = getMentionables().filter(x => x.name.toLowerCase().includes(q));
    if (!acItems.length) { acEl.classList.remove('open'); return; }
    acIndex = 0;
    acEl.innerHTML = acItems.map((item, i) =>
      '<div class="sw-ac-item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
      '<span class="sw-ac-type">' + escapeHtml(item.type) + '</span><span>' + escapeHtml(item.name) + '</span></div>'
    ).join('');
    const rootRect = ROOT.getBoundingClientRect();
    acEl.style.left = (rect.left - rootRect.left) + 'px';
    acEl.style.top = (rect.bottom - rootRect.top + 4) + 'px';
    acEl.classList.add('open');
    acEl.querySelectorAll('.sw-ac-item').forEach(el => {
      el.addEventListener('mousedown', (e) => { e.preventDefault(); insertMention(acItems[+el.dataset.i]); });
    });
  }
  function insertMention(item) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const node = range.startContainer;
    if (node.nodeType !== 3) return;
    const text = node.textContent;
    let start = range.startOffset - 1;
    while (start >= 0 && text[start] !== '@') start--;
    if (start < 0 || text[start] !== '@') return;
    const before = text.slice(0, start);
    const after = text.slice(range.startOffset);
    const span = document.createElement('span');
    span.className = 'sw-mention';
    span.dataset.type = item.type;
    span.dataset.id = item.id;
    span.textContent = item.name;
    span.contentEditable = 'false';
    node.textContent = before;
    const parent = node.parentNode;
    const afterNode = document.createTextNode(after || '\u00a0');
    parent.insertBefore(span, node.nextSibling);
    parent.insertBefore(afterNode, span.nextSibling);
    const nr = document.createRange();
    nr.setStartAfter(afterNode);
    nr.collapse(true);
    sel.removeAllRanges();
    sel.addRange(nr);
    acEl.classList.remove('open');
    onEditorInput();
  }
  function checkAtTrigger() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) { acEl.classList.remove('open'); return; }
    const range = sel.getRangeAt(0);
    if (range.startContainer.nodeType !== 3) { acEl.classList.remove('open'); return; }
    const text = range.startContainer.textContent.slice(0, range.startOffset);
    const m = text.match(/@([^\s@]*)$/);
    if (m) showAutocomplete(m[1], range.getBoundingClientRect());
    else acEl.classList.remove('open');
  }

  function findEntity(type, id) {
    if (type === 'character') return state.characters.find(c => c.id === id);
    if (type === 'location') return state.locations.find(l => l.id === id);
    if (type === 'planet') return state.planets.find(p => p.id === id);
    if (type === 'religion') return state.religions.find(r => r.id === id);
    return null;
  }
  let hoverTimer = null;
  function stripHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return d.innerText || '';
  }
  function findLastSeen(type, id, name) {
    const needle = (name || '').toLowerCase();
    if (!needle) return null;
    for (let ci = state.chapters.length - 1; ci >= 0; ci--) {
      const ch = state.chapters[ci];
      for (let si = ch.scenes.length - 1; si >= 0; si--) {
        const sc = ch.scenes[si];
        const plain = stripHtml(sc.content).toLowerCase();
        const htmlc = (sc.content || '').toLowerCase();
        if (htmlc.indexOf('data-id="' + id + '"') >= 0 || plain.indexOf(needle) >= 0) {
          return ch.title + ' / ' + sc.title;
        }
      }
    }
    return null;
  }

  function showHover(mentionEl) {
    const data = findEntity(mentionEl.dataset.type, mentionEl.dataset.id);
    if (!data) { hoverEl.classList.remove('open'); return; }
    const last = findLastSeen(mentionEl.dataset.type, mentionEl.dataset.id, data.name);
    let body = '<div class="sw-hp-type">' + escapeHtml(mentionEl.dataset.type) + '</div><h4>' + escapeHtml(data.name) + '</h4>';
    if (last) body += '<p style="font-size:0.75rem;color:var(--sw-muted)">Last seen: ' + escapeHtml(last) + '</p>';
    if (data.role) body += '<p style="color:var(--sw-muted)">' + escapeHtml(data.role) + '</p>';

  let dictRange = null;

  async function showDict(word) {
    word = (word || '').replace(/[^a-zA-Z'-]/g, '');
    if (word.length < 2) return;

    // Preserve selection so we can replace the word after the modal opens
    const sel = window.getSelection();
    if (sel.rangeCount) {
      try { dictRange = sel.getRangeAt(0).cloneRange(); } catch (e) { dictRange = null; }
    }

    openModal(
      '<h3>Dictionary</h3>' +
      '<p style="margin:0 0 10px;color:var(--sw-muted);font-size:0.88rem">Word: <strong style="color:var(--sw-ink)">' + escapeHtml(word) + '</strong></p>' +
      '<div id="m-dict-body"><p style="color:var(--sw-muted)">Looking up…</p></div>' +
      '<div class="sw-modal-actions"><button type="button" class="sw-btn" id="m-cancel">Close</button></div>'
    );
    $('#m-cancel').onclick = closeModal;

    const body = $('#m-dict-body');
    try {
      const [syn, ant, rhy, rel] = await Promise.all([
        fetch('https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(word) + '&max=16').then(r => r.json()),
        fetch('https://api.datamuse.com/words?rel_ant=' + encodeURIComponent(word) + '&max=10').then(r => r.json()),
        fetch('https://api.datamuse.com/words?rel_rhy=' + encodeURIComponent(word) + '&max=10').then(r => r.json()),
        fetch('https://api.datamuse.com/words?ml=' + encodeURIComponent(word) + '&max=12').then(r => r.json())
      ]);

      function block(title, arr) {
        if (!arr || !arr.length) return '';
        let h = '<h4 style="margin:12px 0 6px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--sw-muted)">' + title + '</h4>';
        h += '<div class="sw-dict-words">';
        arr.forEach(w => {
          const term = w.word || w;
          h += '<button type="button" class="sw-btn" data-w="' + escapeHtml(term) + '" style="margin:2px">' + escapeHtml(term) + '</button>';
        });
        h += '</div>';
        return h;
      }

      let htmlBody = block('Synonyms', syn) + block('Related', rel) + block('Antonyms', ant) + block('Rhymes', rhy);
      if (!htmlBody) htmlBody = '<p style="color:var(--sw-muted)">No results for this word.</p>';
      htmlBody += '<p style="margin-top:12px;font-size:0.78rem;color:var(--sw-muted)">Click a word to replace the selection in your scene.</p>';
      body.innerHTML = htmlBody;

      body.querySelectorAll('button[data-w]').forEach(btn => {
        btn.addEventListener('click', () => {
          const replacement = btn.dataset.w;
          closeModal();
          editor.focus();
          const sel2 = window.getSelection();
          sel2.removeAllRanges();
          if (dictRange) {
            try {
              sel2.addRange(dictRange);
              document.execCommand('insertText', false, replacement);
            } catch (e) {
              // fallback: append at end of selection failure
              document.execCommand('insertText', false, replacement);
            }
          } else {
            document.execCommand('insertText', false, replacement);
          }
          dictRange = null;
          onEditorInput();
          toast('Replaced with “' + replacement + '”');
        });
      });
    } catch (e) {
      body.innerHTML = '<p style="color:var(--sw-muted)">Dictionary could not load. Check your connection and try again.</p>';
    }
  }

  editor.addEventListener('dblclick', (e) => {
    // Let the browser select the word first, then read selection
    setTimeout(() => {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      let word = sel.toString().trim();
      // If selection is empty or multi-word, try expand from caret
      if (!word || /\\s/.test(word)) {
        try {
          const range = sel.getRangeAt(0);
          const node = range.startContainer;
          if (node.nodeType === 3) {
            const text = node.textContent;
            let i = range.startOffset;
            let j = range.startOffset;
            while (i > 0 && /[a-zA-Z'-]/.test(text[i - 1])) i--;
            while (j < text.length && /[a-zA-Z'-]/.test(text[j])) j++;
            word = text.slice(i, j);
            if (word.length >= 2) {
              const r = document.createRange();
              r.setStart(node, i);
              r.setEnd(node, j);
              sel.removeAllRanges();
              sel.addRange(r);
            }
          }
        } catch (err) {}
      }
      word = (word || '').trim();
      if (!word || word.length < 2) return;
      // Single token only
      if (/\\s/.test(word)) return;
      showDict(word);
    }, 10);
  });

  // ----- Export -----
  function htmlToPlain(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return d.innerText || '';
  }
  function manuscriptPlain() {
    let t = '';
    state.chapters.forEach(ch => {
      t += '\n\n' + ch.title + '\n' + '='.repeat(Math.min(40, ch.title.length)) + '\n';
      ch.scenes.forEach(sc => {
        t += '\n' + sc.title + '\n\n' + htmlToPlain(sc.content) + '\n';
      });
    });
    return t.trim();
  }
  function manuscriptHtml() {
    let h = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Manuscript</title>' +
      '<style>body{font-family:Georgia,serif;max-width:40em;margin:2em auto;line-height:1.6;padding:0 1em}h1{font-size:1.6em}h2{font-size:1.25em;margin-top:1.5em}</style></head><body>';
    state.chapters.forEach(ch => {
      h += '<h1>' + escapeHtml(ch.title) + '</h1>';
      ch.scenes.forEach(sc => {
        h += '<h2>' + escapeHtml(sc.title) + '</h2>';
        const plain = htmlToPlain(sc.content).split(/\n/).map(l => '<p>' + escapeHtml(l || ' ') + '</p>').join('');
        h += plain;
      });
    });
    return h + '</body></html>';
  }
  async function exportDocx() {
    if (!window.docx) { toast('DOCX library not loaded'); return; }
    const { Document, Packer, Paragraph, TextRun, PageBreak } = window.docx;
    const children = [];
    state.chapters.forEach((ch, i) => {
      if (i > 0) children.push(new Paragraph({ children: [new PageBreak()] }));
      children.push(new Paragraph({
        spacing: { after: 200 },
        children: [new TextRun({ text: ch.title, bold: true, font: 'Georgia', size: 36 })]
      }));
      ch.scenes.forEach(sc => {
        children.push(new Paragraph({
          spacing: { before: 240, after: 120 },
          children: [new TextRun({ text: sc.title, bold: true, font: 'Georgia', size: 28 })]
        }));
        htmlToPlain(sc.content).split(/\n/).forEach(line => {
          children.push(new Paragraph({
            spacing: { after: 100 },
            children: [new TextRun({ text: line || ' ', font: 'Georgia', size: 24 })]
          }));
        });
      });
    });
    const doc = new Document({ sections: [{ children }] });
    const blob = await Packer.toBlob(doc);
    saveAs(blob, 'manuscript.docx');
    toast('DOCX downloaded');
  }
  function exportTxt() {
    const blob = new Blob([manuscriptPlain()], { type: 'text/plain;charset=utf-8' });
    saveAs(blob, 'manuscript.txt');
    toast('Text downloaded');
  }
  function exportHtml() {
    const blob = new Blob([manuscriptHtml()], { type: 'text/html;charset=utf-8' });
    saveAs(blob, 'manuscript.html');
    toast('HTML downloaded');
  }
  function exportJson() {
    saveCurrent();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    saveAs(blob, 'storywriter-project.json');
    toast('Project JSON downloaded');
  }

  async function saveListDocx(title, items, fields, filename) {
    if (!items.length) { toast('Nothing to export'); return; }
    if (!window.docx) { toast('DOCX library not loaded'); return; }
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const children = [new Paragraph({ children: [new TextRun({ text: title, bold: true, size: 36, font: 'Georgia' })] })];
    items.forEach(item => {
      children.push(new Paragraph({ spacing: { before: 280 }, children: [new TextRun({ text: item.name || 'Untitled', bold: true, size: 28, font: 'Georgia' })] }));
      fields.forEach(([label, key]) => {
        if (item[key]) children.push(new Paragraph({ children: [new TextRun({ text: label + ': ' + item[key], size: 22, font: 'Georgia' })] }));
      });
    });
    const doc = new Document({ sections: [{ children }] });
    saveAs(await Packer.toBlob(doc), filename);
    toast('Downloaded');
  }

  // ----- Search -----
  function openSearch() {
    openModal('<h3>Search project</h3><input class="sw-inp" id="m-search" placeholder="Find in manuscript, characters, locations…">' +
      '<div id="m-search-results" style="margin-top:12px;max-height:280px;overflow:auto"></div>' +
      '<div class="sw-modal-actions"><button type="button" class="sw-btn" id="m-cancel">Close</button></div>');
    $('#m-cancel').onclick = closeModal;
    const run = () => {
      const q = ($('#m-search').value || '').trim().toLowerCase();
      const box = $('#m-search-results');
      if (!q) { box.innerHTML = ''; return; }
      const hits = [];
      state.chapters.forEach(ch => ch.scenes.forEach(sc => {
        if ((sc.title + ' ' + sc.synopsis + ' ' + htmlToPlain(sc.content)).toLowerCase().includes(q)) {
          hits.push({ type: 'Scene', label: ch.title + ' / ' + sc.title, go: () => { closeModal(); switchTab('story'); switchScene(ch.id, sc.id); } });
        }
      }));
      state.characters.forEach(c => {
        if (JSON.stringify(c).toLowerCase().includes(q)) hits.push({ type: 'Character', label: c.name, go: () => { closeModal(); switchTab('characters'); showDetail('character', c.id); } });
      });
      state.locations.forEach(l => {
        if (JSON.stringify(l).toLowerCase().includes(q)) hits.push({ type: 'Location', label: l.name, go: () => { closeModal(); switchTab('locations'); showDetail('location', l.id); } });
      });
      if (!hits.length) { box.innerHTML = '<p style="color:var(--sw-muted)">No matches</p>'; return; }
      box.innerHTML = hits.map((h, i) =>
        '<button type="button" class="sw-btn" data-i="' + i + '" style="display:block;width:100%;text-align:left;margin-bottom:4px">' +
        '<span style="color:var(--sw-muted);font-size:0.7rem">' + escapeHtml(h.type) + '</span> ' + escapeHtml(h.label) + '</button>'
      ).join('');
      box.querySelectorAll('button').forEach(btn => btn.onclick = () => hits[+btn.dataset.i].go());
    };
    $('#m-search').oninput = run;
    $('#m-search').focus();
  }

  function applyTemplate(tpl) {
    state.locations = state.locations || [];
    state.characters = state.characters || [];
    if (tpl === 'novel') {
      state.chapters = [];
      for (let i = 1; i <= 10; i++) {
        const ch = emptyChapter('Chapter ' + i, i);
        ch.synopsis = 'What changes in this chapter?';
        ch.scenes = [emptyScene('Scene 1'), emptyScene('Scene 2')];
        ch.scenes[0].synopsis = 'Opening beat';
        ch.scenes[1].synopsis = 'Closing beat';
        state.chapters.push(ch);
      }
    } else if (tpl === 'novella') {
      state.chapters = [];
      for (let i = 1; i <= 6; i++) {
        const ch = emptyChapter('Chapter ' + i, i);
        ch.scenes = [emptyScene('Scene 1')];
        state.chapters.push(ch);
      }
    } else if (tpl === 'short') {
      const ch = emptyChapter('Short story', 1);
      ch.synopsis = 'One-sentence story promise';
      ch.scenes = [
        Object.assign(emptyScene('Opening'), { synopsis: 'World and want' }),
        Object.assign(emptyScene('Turn'), { synopsis: 'Complication' }),
        Object.assign(emptyScene('Ending'), { synopsis: 'Cost or change' })
      ];
      state.chapters = [ch];
    } else if (tpl === 'trilogy') {
      state.chapters = [
        Object.assign(emptyChapter('Book 1 - Outline', 1), { synopsis: 'Book 1 arc' }),
        Object.assign(emptyChapter('Book 2 - Outline', 2), { synopsis: 'Book 2 arc' }),
        Object.assign(emptyChapter('Book 3 - Outline', 3), { synopsis: 'Book 3 arc' })
      ];
      state.characters = [
        { id: uid(), name: 'Protagonist', role: 'Lead', age: '', appearance: '', traits: '', wants: '', fears: '', values: '', background: '', conflict: '', arc: 'Arc across three books', notes: '', image: '' },
        { id: uid(), name: 'Antagonist', role: 'Opposition', age: '', appearance: '', traits: '', wants: '', fears: '', values: '', background: '', conflict: '', arc: '', notes: '', image: '' }
      ];
      state.locations = [
        { id: uid(), name: 'Home region', kind: 'region', description: '', notes: 'Shared across the trilogy', image: '' }
      ];
    } else if (tpl === 'poetry') {
      state.chapters = [];
      for (let i = 1; i <= 12; i++) {
        const ch = emptyChapter('Poem ' + i, i);
        ch.synopsis = 'Theme or first line';
        ch.scenes = [Object.assign(emptyScene('Draft'), { synopsis: 'Working draft' })];
        state.chapters.push(ch);
      }
    } else if (tpl === 'scenes') {
      const ch = emptyChapter('Workshop', 1);
      ch.synopsis = 'Loose scene practice';
      ch.scenes = [];
      for (let i = 1; i <= 8; i++) ch.scenes.push(emptyScene('Scene ' + i));
      state.chapters = [ch];
    } else {
      state.chapters = [emptyChapter('Chapter 1', 1)];
      state.characters = [];
      state.locations = [];
      state.religions = [];
      state.planets = [];
      state.brainstorm = '';
    }
    state.activeChapterId = state.chapters[0].id;
    state.activeSceneId = state.chapters[0].scenes[0].id;
    state.goals.sessionBase = 0;
    state.openThreads = state.openThreads || [];
    renderChapters();
    loadIntoEditor();
    save();
    toast('Template applied');
  }

      return;

    html += '<p style="font-size:0.72rem;color:var(--sw-muted);text-transform:uppercase">' + escapeHtml(state.pinnedRef.type) + '</p>';
    if (last) html += '<p style="font-size:0.78rem;color:var(--sw-muted)">Last seen: ' + escapeHtml(last) + '</p>';
    if (data.image) html += '<img src="' + data.image + '" style="max-width:100%;border-radius:6px;margin:6px 0">';

  function scrollCaretToCenter() {
    if (!state.typewriter) return;
    const wrap = writeView;
    if (!wrap) return;
    const sel = window.getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return;
    try {
      const range = sel.getRangeAt(0).cloneRange();
      range.collapse(true);
      const rects = range.getClientRects();
      let caretTop;
      if (rects.length) {
        caretTop = rects[0].top;
      } else {
        const marker = document.createElement('span');
        marker.textContent = '\u200b';
        range.insertNode(marker);
        caretTop = marker.getBoundingClientRect().top;
        marker.parentNode.removeChild(marker);
      }
      const wrapRect = wrap.getBoundingClientRect();
      const offsetWithin = caretTop - wrapRect.top + wrap.scrollTop;
      const target = offsetWithin - wrap.clientHeight / 2;
      wrap.scrollTop = Math.max(0, target);
    } catch (e) {}
  }

  function toggleTypewriter() {
    state.typewriter = !state.typewriter;
    ROOT.classList.toggle('sw-typewriter', state.typewriter);

    if (state.typewriter) {

  let isReading = false;
  function updateReadBtn() {
    const btn = $('#sw-read-btn');

  function stopReading() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    isReading = false;
    updateReadBtn();
  }
  function readAloud() {
    if (!window.speechSynthesis) { toast('Speech not supported'); return; }
    if (isReading) {
      stopReading();
      toast('Stopped');
      return;
    }
    const text = stripHtml(editor.innerHTML);
    if (!text.trim()) { toast('Nothing to read'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 12000));
    u.rate = 1;
    u.onend = () => { isReading = false; updateReadBtn(); };
    u.onerror = () => { isReading = false; updateReadBtn(); };
    isReading = true;
    updateReadBtn();
    window.speechSynthesis.speak(u);
    toast('Reading… (click Stop to end)');
  }
